function dialog(html, onMount) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = '<div class="modal">' + html + "</div>";
  document.body.appendChild(scrim);
  const close = () => { scrim.classList.add("closing"); scrim.remove(); };
  scrim.addEventListener("mousedown", (e) => { if (e.target === scrim) close(); });
  $$(".js-close", scrim).forEach((b) => b.addEventListener("click", close));
  onMount && onMount(scrim, close);
  return { scrim, close };
}
function promptDialog(title, label, value, cb, ph) {
  const { scrim, close } = dialog(
    '<div class="modal-h"><b>' + esc(title) + '</b><button class="x js-close">✕</button></div>' +
    '<div class="modal-b">' + (label ? '<p class="tight">' + esc(label) + "</p>" : "") +
    '<input class="inp-wide" id="dlgIn" value="' + esc(value || "") + '" placeholder="' + esc(ph || "") + '"></div>' +
    '<div class="modal-f"><button class="btn js-close">取消</button><button class="btn btn--go" id="dlgOk">确定</button></div>',
    (s, c) => {
      const inp = $("#dlgIn", s);
      inp.focus(); inp.select();
      const go = () => { const v = inp.value.trim(); if (v) { c(); cb(v); } };
      $("#dlgOk", s).addEventListener("click", go);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); if (e.key === "Escape") c(); });
    });
}
function confirmDialog(title, msg, cb) {
  const { scrim, close } = dialog(
    '<div class="modal-h"><b>' + esc(title) + '</b><button class="x js-close">✕</button></div>' +
    '<div class="modal-b"><p style="color:var(--text)">' + esc(msg) + "</p></div>" +
    '<div class="modal-f"><button class="btn js-close">取消</button><button class="btn btn--go danger" id="dlgYes">继续</button></div>',
    (s, c) => $("#dlgYes", s).addEventListener("click", () => { c(); cb(); }));
}

function storageReport() {
  const size = (s) => { if (!s) return 0; try { return new Blob([s]).size; } catch (e) { return s.length; } };
  const out = { rows: [], total: 0, all: 0 };
  try {
    (reg.projects || []).forEach((m) => {
      const a = localStorage.getItem(K_PROJ(m.id)), b = localStorage.getItem(K_PREV(m.id));
      out.rows.push({ id: m.id, name: m.name, main: size(a), prev: size(b), missing: !a });
      out.total += size(a) + size(b);
    });
    [K_REG, K_SET, K_BACKUP].forEach((k) => { out.total += size(localStorage.getItem(k)); });
    for (let i = 0; i < localStorage.length; i++) out.all += size(localStorage.getItem(localStorage.key(i)));
  } catch (e) { }
  return out;
}
function storageBlock() {
  const r = storageReport();
  const rows = r.rows.map((x) =>
    '<div class="sto-row"><span class="nm">' + esc(x.name) + "</span>" +
    '<span class="kb">' + fmtBytes(x.main) + "</span>" +
    '<span class="kb prev">' + (x.prev ? "回滚点 " + fmtBytes(x.prev) : "尚无回滚点") + "</span>" +
    (x.missing ? '<span class="tag tag--key">缺主档</span>' : "") + "</div>").join("");
  return '<div class="sto"><div class="sto-h"><b>本地存储</b>' +
    '<span class="tot">本工具合计 ' + fmtBytes(r.total) + " · 浏览器全部本地页 " + fmtBytes(r.all) + "</span></div>" +
    (rows || '<div class="sto-row"><span class="nm">（还没有图纸）</span></div>') +
    '<p class="sto-note">每次成功保存都会把上一份留成"回滚点"，主档校验不过时会自动退回它。' +
    'file:// 打开的网页共用同一份浏览器存储，所以这里看到的体积包含同目录的其它本地页面。<br>' +
    '<button class="tool" id="stoGc">清理无主回滚点</button></p></div>';
}
/* 主档与上一版互换：回滚是可逆的，再点一次就换回来，不需要"确认两次"式的保护。 */
function revertProject() {
  if (!P) return;
  const prevRaw = lsGet(K_PREV(P.id));
  if (!prevRaw) { toast("这份图纸还没有上一版存档（每成功保存一次就会留下一版）", "bad"); return; }
  let prev = null;
  try { prev = normalize(migrate(JSON.parse(prevRaw))); } catch (e) { toast("上一版存档读不出来：" + e.message, "bad"); return; }
  const bad = validateProject(prev);
  if (bad.length) { toast("上一版存档不合格：" + bad.slice(0, 2).join("；"), "bad"); return; }
  const when = prev.updatedAt ? new Date(prev.updatedAt).toLocaleString("zh-CN", { hour12: false }) : "时间未知";
  confirmDialog("回滚到上一版",
    "上一版：" + prev.lines.length + " 条线路 / " + Object.keys(prev.stations).length + " 个车站 · " + when +
    "。当前这份会被换成它（再点一次可以换回来）。",
    () => {
      try {
        const cur = localStorage.getItem(K_PROJ(P.id));
        if (cur) localStorage.setItem(K_PREV(P.id), cur);
        localStorage.setItem(K_PROJ(P.id), prevRaw);
        openProject(P.id);
        toast("已回滚到 " + when, "good");
      } catch (e) { toast("回滚失败：" + e.name, "bad"); }
    });
}

function fname(ext) {
  return (P.name || "subway-map").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 48) + "_" + new Date().toISOString().slice(0, 10) + "." + ext;
}
function exportJson() {

/* 外部图纸进入本机的唯一一条路：文件导入与服务器种子都必须走这儿。
   两条路径各写一套校验的话，迟早有一条放水 —— 不合格数据进了图纸列表，
   用户点开才发现是张空图。返回新图纸的 id 与统计。 */
/* 导入后缀只加一次：从服务器取回一份"本来就是导入件"的图纸时，
   后缀叠成"廊坊地铁（导入）（导入）"很难看（实测撞见过）。 */
function importedName(base) {
  const b = String(base == null ? "" : base).trim() || "导入图纸";
  return /（导入）$/.test(b) ? b : b + "（导入）";
}
function adoptProject(rawIn, srcName) {
  const p = rawIn && rawIn.project && rawIn.project.lines ? rawIn.project : rawIn;
  if (!Array.isArray(p.lines)) throw new Error("缺少 lines 字段");
  p.id = uid("p_");
  p.name = importedName(p.name || String(srcName || "导入图纸").replace(/\.json$/i, ""));
  resetClips();
  const q = normalize(migrate(p));
  /* 导入/种子档常常没有 updatedAt（导出的信封把时间放在 savedAt），
     少了这一步状态栏会显示 "Invalid Date"，而且注册表那行的排序也会拿 undefined 比。 */
  if (!validStamp(q.updatedAt)) q.updatedAt = Date.now();
  const clipped = lastClipCount;
  const bad = validateProject(q);
  if (bad.length) throw new Error("数据不合格：" + bad.slice(0, 3).join("；"));
  store.set(K_PROJ(q.id), q);
  reg.projects.unshift({ id: q.id, name: q.name, updatedAt: Date.now(), lines: q.lines.length, stations: Object.keys(q.stations).length });
  store.set(K_REG, reg);
  return { id: q.id, lines: q.lines.length, stations: Object.keys(q.stations).length, clipped };
}
function importJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const got = adoptProject(d, file.name);
      openProject(got.id);
      if (d && d.basemap && BASEMAPS.some((b) => b.id === d.basemap)) { settings.basemap = d.basemap; store.set(K_SET, settings); fillBasemapSelect(); applyBasemap(); }
      fitAll();
      toast("已载入 " + got.lines + " 条线路 / " + got.stations + " 个车站" +
        (got.clipped ? "（" + got.clipped + " 处文本超出上限，已裁到位）" : ""), "good");
    } catch (e) {
      toast("解析失败：" + e.message, "bad");
      console.warn(e);
    }
  };
  r.readAsText(file, "utf-8");
}
/* 服务器种子图纸：用 http(s) 打开时读同目录的 data/seeds.json，把列出来的图纸并进本机，
   换设备不必再手动导文件。file:// 下一条网络请求都不发 —— 单文件双击即开的承诺不变。
   每个 key 只导一次（记在 subwaystudio.v1.seeds 里）：用户删掉某张种子图后不该刷回来。 */
const K_SEEDS = NS + ".seeds";
let lastSeedId = null;
function seedsAllowed(protocol, runningSelfTest, staticHost = STATIC_HOST) { return !staticHost && !runningSelfTest && /^https?:$/.test(String(protocol || "")); }
async function loadServerSeeds() {
  if (!seedsAllowed(location.protocol, inSelfTest)) return 0;
  let list;
  try {
    const resp = await fetch("data/seeds.json", { cache: "no-store" });
    if (!resp.ok) return 0;
    list = await resp.json();
  } catch (e) { return 0; }                       // 没有清单 = 这台服务器不放图纸，静默
  if (!Array.isArray(list) || !list.length) return 0;
  const seen = store.get(K_SEEDS, null);
  const done = Array.isArray(seen) ? seen.slice() : [];
  let n = 0;
  for (const s of list) {
    if (!s || !s.key || !s.file) continue;
    if (done.indexOf(s.key) >= 0) continue;
    if (inSelfTest) break;                        // 自检已经开跑就别再动注册表（异步污染栽过一次）
    try {
      const resp = await fetch(s.file, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const got = adoptProject(JSON.parse(await resp.text()), s.title || s.file);
      done.push(s.key); store.set(K_SEEDS, done);
      lastSeedId = got.id; n++;
    } catch (e) {
      /* 坏种子也记账：否则每次开局都重试一遍、每次都在控制台留一排红，
         还会把"这台服务器上有图纸"的错觉一直留着。 */
      console.warn("服务器图纸不可用：" + s.file, e);
      done.push(s.key); store.set(K_SEEDS, done);
    }
  }
  if (n) { fillProjSelect(); renderPanels && renderPanels(); }
  return n;
}
/* ============================================================
   局域网存档（服务端在 server.mjs 的 /api/*，口令只在服务端比对）
   ------------------------------------------------------------
   只在 http(s) 打开时可用：file:// 没有同源后端，跨源去够一台局域网机器上的
   明文服务既不合适也不安全，所以双击打开的版本不显示这个入口。
   名字规则客户端也写了一份，但它只负责"提前给个准信"——服务端才是权威，
   两边漂了以服务端 bad_name 为准。这条不是安全边界，是体验边界。 */
let archAutoTimer = null, archLastAudit = "未跑";
function archAllowedFor(protocol) { return /^https?:$/.test(String(protocol == null ? "" : protocol)); }
function archAvailable() { return !STATIC_HOST && archAllowedFor(location.protocol); }
/* 自动上传该不该发生，抽成纯函数：同步断言没法等 2.5 秒的防抖，
   而"自检期间绝不推"这条一旦写散在 if 里就迟早被人改错。 */
function archAutoAllowed(cfg, protocol, runningSelfTest, staticHost = STATIC_HOST) {
  return !staticHost && !!(cfg && cfg.archKey) && !!cfg.archAuto && archAllowedFor(protocol) && !runningSelfTest;
}
function archNameOk(raw) {
  const n = String(raw == null ? "" : raw);
  if (!n || !n.trim() || n.length > 64) return false;   // 全空格也算空：会生成一个"看不见名字"的存档
  if (n.charAt(0) === "." || n.indexOf("..") >= 0) return false;
  if (/[\/\\\u0000-\u001f]/.test(n)) return false;
  return /^[A-Za-z0-9_\u4e00-\u9fa5.\- ]+$/.test(n);
}
function archDefaultName() {
  const base = String((P && P.name) || "图纸").replace(/[\/\\\u0000-\u001f]/g, "-").replace(/^\.+/, "").slice(0, 60);
  return base || "图纸";
}
function archFetch(path, opt) {
  if (!archAvailable()) return Promise.reject(new Error(STATIC_HOST ? "静态网页没有局域网存档服务" : "本机双击打开时没有同源后端"));
  const o = Object.assign({ cache: "no-store" }, opt || {});
  /* 口令必须编码后再进 header：HTTP 头只允许 latin-1，用户随手输一个中文口令时
     裸写会让 fetch 直接抛 "String contains non ISO-8859-1 code point" —— 表现是
     "永远连不上服务器",而且报错信息跟鉴权毫无关系（自检的错口令负对照就是这么被带偏的）。
     服务端做同款 decode，纯 ASCII 口令两边都无感。 */
  o.headers = Object.assign({ "x-archive-key": encodeURIComponent(String(settings.archKey || "")) }, o.headers || {});

}
function archEnvelope() {
  return JSON.stringify({ format: "subwaystudio-archive", version: CURRENT_VERSION, savedAt: Date.now(), basemap: settings.basemap, project: P });
}
async function archProbe() {
  try { const r = await archFetch("/api/ping"); const j = await r.json(); return !!(j && j.ok && j.archive); } catch (e) { return false; }
}
async function archPush(name, text) {
  if (!archAvailable()) return { ok: false, error: STATIC_HOST ? "静态网页没有局域网存档服务；请导出 JSON 备份" : "本机双击打开时没有同源后端" };
  if (!archNameOk(name)) return { ok: false, error: "存档名不合法（1-64 字，不能以点开头、不能有 / \\）" };
  if (!String(settings.archKey || "")) return { ok: false, error: "还没填存档口令" };
  try {
    const r = await archFetch("/api/save?name=" + encodeURIComponent(name), { method: "POST", body: text || archEnvelope() });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) return { ok: false, error: "口令不对" };
    if (!r.ok) return { ok: false, error: (j && j.error) || ("HTTP " + r.status) };
    return { ok: true, name, bytes: j.bytes };
  } catch (e) { return { ok: false, error: "连不上服务器：" + e.message }; }
}
async function archList() {
  try {
    const r = await archFetch("/api/saves");
    if (r.status === 401) return { ok: false, error: "口令不对" };
    if (!r.ok) return { ok: false, error: "HTTP " + r.status };
    const j = await r.json();
    return { ok: true, items: (j && j.items) || [] };
  } catch (e) { return { ok: false, error: "连不上服务器：" + e.message }; }
}
/* 取回＝落成一份新图纸（adoptProject 那条唯一入口，带 normalize + validate 闸门），
   绝不覆盖当前图纸：拿一台设备的旧档盖掉这台设备刚画的东西，是不可逆的事故。 */
async function archPull(name) {
  try {
    const r = await archFetch("/api/save?name=" + encodeURIComponent(name));
    if (!r.ok) return { ok: false, error: r.status === 401 ? "口令不对" : "存档不存在" };
    const env = JSON.parse(await r.text());
    const got = adoptProject(env, name);
    openProject(got.id); fitAll();
    return { ok: true, id: got.id, lines: got.lines, stations: got.stations };
  } catch (e) { return { ok: false, error: e.message }; }
}
async function archDelete(name) {
  try {
    const r = await archFetch("/api/save?name=" + encodeURIComponent(name), { method: "DELETE" });
    const j = await r.json().catch(() => ({}));
    return { ok: !!j.ok, error: j.error || ("HTTP " + r.status) };
  } catch (e) { return { ok: false, error: e.message }; }

/* 每次本地保存成功后，顺带往服务器推一份（可关）。
   刻意挂在 persistProject 成功分支的末尾：本地都没写成功就不要在服务器上造出
   一份"看着是最新、其实没落地"的档。自检期间一律不推。 */
function queueArchivePush() {
  if (!archAutoAllowed(settings, location.protocol, inSelfTest) || !P) return;
  if (archAutoTimer) clearTimeout(archAutoTimer);
  archAutoTimer = setTimeout(() => {
    archAutoTimer = null;
    archPush(settings.archAutoName || archDefaultName()).then((r) => {
      if (!r.ok) toast("局域网存档没写进去：" + r.error, "bad");
      /* 成功刻意不打扰：底栏那格状态会把状态条挤到无声截断（第 63 条实测抓到过），
         真要看得境况就去存档面板，列表上的时间戳就是权威。 */
    });

}

async function runArchiveAudit(box) {

      if (!up.ok) bad.push("上传失败：" + up.error);
      const ls = await archList();
      listed = !!(ls.ok && ls.items.some((x) => x.name === probeName));
      if (!listed && up.ok) bad.push("上传说成功，列表里却没有");
      let text = "";
      try { const r = await archFetch("/api/save?name=" + encodeURIComponent(probeName)); text = await r.text(); } catch (e) { }
      pulled = text === JSON.stringify(probe);
      if (up.ok && !pulled) bad.push("取回的字节与上传的不一致");
      const del = await archDelete(probeName);
      const ls2 = await archList();
      deleted = !!del.ok && !(ls2.ok && ls2.items.some((x) => x.name === probeName));
      if (!deleted) bad.push("探针档没删干净：" + (del.error || "列表里还在"));
      const badName = await archPush("../逃逸", JSON.stringify(probe));
      if (badName.ok) bad.push("负对照失效：路径穿越名被服务端收了");
    }
  }
  archLastAudit = bad.length ? "失败" : "通过";
  const row = (label, ok) => '<div class="help-row"><kbd style="min-width:34px;color:' + (ok ? "var(--live)" : "var(--alert)") + '">' + (ok ? "PASS" : "FAIL") + "</kbd><span>" + esc(label) + "</span></div>";
  box.innerHTML = '<div class="help-row"><kbd style="min-width:34px;color:' + (bad.length ? "var(--alert)" : "var(--live)") + '">' + (bad.length ? "WARN" : "PASS") + "</kbd><span>局域网存档往返（探针档已自建自删）</span></div>" +
    (bad.length ? bad.map((b) => '<p class="sto-note" style="color:var(--alert)">' + esc(b) + "</p>").join("") :
      [row("错口令被拒（负对照）", denied), row("上传后能在列表里看到", listed), row("取回字节与上传一致", pulled), row("删除后确实没了", deleted), row("路径穿越名被拒", true)].join("")) +
    '<p class="sto-note">服务端规则（名字、体积、内容像不像图纸）由 server.mjs 判；这一轮验的是浏览器这一侧真能走通。</p>';
}

/* --- 矢量图导出（不含底图） --- */
function mercY(lat) {
  const t = clamp(lat, -85, 85) * Math.PI / 180;
  return (1 - Math.log(Math.tan(t) + 1 / Math.cos(t)) / Math.PI) / 2;
}
/* 图例排版（两处导出共用）。旧写法是"一条一摞从底部往上堆"，行高固定、
   总高不封顶：线一多就一直吃进画心——实测 22 条线时 88 个站名全部落在图例带里，
   整张导出成废图。现在先封顶 9 行、超出就分栏，并把图例真正占的高度算进下边距，
   让地图区域自己缩下去。 */
const LEG_ROW = 24, LEG_MAX_ROWS = 9;
function legendLabel(l, withNote) {
  return String(l.name || "") + (withNote ? ((l.loop ? " · 环线" : "") + (l.style === "dash" ? " · 在建" : "")) : "");
}
function legendGeom(visLines, canvasW, withNote) {
  const n = visLines.length;
  if (!n) return { rows: 0, cols: 0, blockH: 0, colW: 0 };
  const cols = Math.max(1, Math.ceil(n / LEG_MAX_ROWS));
  const rows = Math.max(1, Math.ceil(n / cols));
  /* 列宽 = 最长那条图例文字实量宽 + 色块 + 栏间距；用估算会把列撑宽、
     反而更早撞上下一条或画幅右沿 */
  const itemW = visLines.reduce((a, l) => Math.max(a, 26 + textWidth(legendLabel(l, withNote), 16, 700)), 0);
  const colW = clamp(itemW + 26, 112, Math.max(112, ((canvasW || 1600) - 96) / cols));
  return { rows, cols, blockH: rows * LEG_ROW, colW, itemW };
}
/* 图例列宽被画幅夹住时，长名字要能收——不截断就会被画布裁掉一半，
   看起来像渲染坏了。按实量宽度逐字回退加省略号，保留至少 4 个字符。 */
function fitText(text, px, weight, maxW) {
  const s = String(text == null ? "" : text);
  if (maxW <= 0 || textWidth(s, px, weight) <= maxW) return s;
  let cut = s.length;
  while (cut > 4 && textWidth(s.slice(0, cut - 1) + "…", px, weight) > maxW) cut--;
  return s.slice(0, Math.max(1, cut - 1)) + "…";
}
function legendSvg(visLines, g, sideX, bottomY, withNote) {
  if (!visLines.length || !g.rows) return "";
  const top = bottomY - g.blockH;
  return visLines.map((l, i) => {
    const c = Math.floor(i / g.rows), r = i % g.rows;
    const x = sideX + c * g.colW, y = top + r * LEG_ROW + LEG_ROW - 8;
    const label = fitText(legendLabel(l, withNote), 16, 700, g.colW - 26 - 10);
    return '<g class="lgd" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')">' +
      '<rect width="18" height="6" y="-5" rx="3" fill="' + l.color + '"/>' +
      '<text x="26" font-family="Barlow Condensed, PingFang SC, sans-serif" font-size="16" fill="#0C1017">' + esc(label) + "</text></g>";
  }).join("");
}

function buildSVG(scaleW) {
  const pts = Object.values(P.stations).filter((s) => s.lines.length);
  if (!pts.length) throw new Error("图纸为空");
  const proj = (s) => [((s.lng + 180) / 360), mercY(s.lat)];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach((s) => { const [x, y] = proj(s); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const exX = (x1 - x0) * 0.18 + 0.0008, exY = (y1 - y0) * 0.18 + 0.0008;   // 给曲线鼓出留出余量

  const visLines = P.lines.filter((l) => l.visible);

  /* 下边距要容得下图例真正占的高度，外加一行站名的余量 */
  const M = { l: 125, r: 125, t: 84, b: 56 + LG.blockH };
  const unit = Math.min((TW - M.l - M.r) / spanX, (TH - M.t - M.b) / spanY);
  const W = Math.round(spanX * unit + M.l + M.r);
  const hh = Math.round(spanY * unit + M.t + M.b);
  const X = (x) => (x - x0) * unit + M.l;
  const Y = (y) => (y - y0) * unit + M.t;

     （visibleLineIndex），后面全部查表，并把"首次出现下标"一并交给 stationGlyph。
     口径不变：只含可见线、按 P.lines 顺序、同一线路最多一次。 */
  const visIdx = visibleLineIndex();

     "车站圆点比站间距还大" —— 实测示例图导出时圆点互相盖住、编号牌无处可放。
     用"每个站到最近站的距离"的中位数定比例：碰撞是关于邻近性的，跟站序间距无关
     （两条线的站在同一处、环线自己贴着自己是常态）。按 x 排序后只比较窗口内的
     点对，150 站也就几千次距离计算，每次导出算一遍。 */
  const byX = pts.map((s) => { const p = proj(s); return { x: X(p[0]), y: Y(p[1]) }; }).sort((a, b) => a.x - b.x);
  const nn = [];
  const WIN = 90;
  for (let i = 0; i < byX.length; i++) {
    let best = Infinity;
    for (let j = i + 1; j < byX.length; j++) {
      const dx = byX[j].x - byX[i].x; if (dx > WIN) break;
      const d = Math.hypot(dx, byX[j].y - byX[i].y); if (d < best) best = d;
    }
    for (let j = i - 1; j >= 0; j--) {

      const d = Math.hypot(dx, byX[i].y - byX[j].y); if (d < best) best = d;

  /* 编号牌要避开的车站圆：用 stationGlyph 的同一口径，

    const ls = visOf(s); if (!ls.length) return null;
    const p = proj(s), g = stationGlyph(s, ls, visIdx.get(s.id).at);
    return { x: X(p[0]), y: Y(p[1]), r: (g.size / 2 + 5) * GS };
  }).filter(Boolean);
  const stnClearQ = badgeClearance(stnAvoid);   // 与地图同一套网格查询；导出时圆也有上千个
  P.lines.forEach((l) => {
    if (!l.visible) return;
    const { segs } = lineShape(l, (s) => { const p = proj(s); return { x: X(p[0]), y: Y(p[1]) }; });
    if (!segs.length) return;
    const os = offsetSegs(segs, groups, l.id);
    const jp = joinSegs(os);
    obst.push(jp);
    const str = jp.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    lineLayers(l).forEach((Ly) => {
      body += '<polyline points="' + str + '" fill="none" stroke="' + Ly.color + '" stroke-width="' + Ly.width + '" stroke-opacity="' + Ly.opacity + '" stroke-linecap="round" stroke-linejoin="round"' + dashOf(Ly.dash) + "/>";
    });
    /* 编号牌：和地图同一套锚点规则（最长的又直又同向的带子）。
       顺手把它当作一条"折线障碍"塞给标签求解器，导出的图里站名就会主动绕开牌子。 */

      /* 牌子和地图上的 .ln-badge 同一档尺寸（高 17 / 宽 max(17, 8+字数×9)），
         只随密度 GS 缩放；线宽不参与，否则导出里的牌会比图上的大一档。 */

      const bw = Math.max(17, textWidth(String(l.badge), 13, 700) + 8) * k;   // 与 .ln-badge 的 padding 0 4px 同口径
      const an = badgeAnchorFromSegs(os, bw + 6, stnClearQ) || badgeAnchorCurved(ribbonPts(os), bw + 6, stnClearQ);
      if (an) {
        const bh = 17 * k;
        body += '<g class="lnb" transform="translate(' + an.x.toFixed(1) + ',' + an.y.toFixed(1) + ') rotate(' + an.deg + ')">' +
          '<rect x="' + (-bw / 2).toFixed(1) + '" y="' + (-bh / 2).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="' + (4 * k).toFixed(1) + '" fill="' + l.color + '" stroke="#FFFFFF" stroke-width="' + (1.5 * k).toFixed(1) + '"/>' +
          '<text x="0" y="' + (4.2 * k).toFixed(1) + '" text-anchor="middle" font-family="Barlow Condensed, PingFang SC, sans-serif" font-size="' + (13 * k).toFixed(1) + '" font-weight="700" fill="' + textOn(l.color) + '">' + esc(l.badge) + "</text></g>";
        obst.push([{ x: an.x - bw / 2 - 3, y: an.y }, { x: an.x + bw / 2 + 3, y: an.y }]);

  /* 手动定过位的铭牌在导出里也要保住：labelOff 存的是"某缩放级下的屏幕像素"，
     而 1 个归一化墨卡托单位 = 256·2^z 屏幕像素，所以 px→SVG单位 = px·unit/(256·2^z)。 */
  const perUnit = (z) => unit / (256 * Math.pow(2, z));
  const lblItems = [];
  const fixedLbl = [];
  pts.forEach((s) => {
    if (!vis(s).length) return;
    const p = proj(s); const sx = X(p[0]), sy = Y(p[1]);
    if (s.labelOff) {
      const k = perUnit(s.labelOff.z || 15), sz = labelSize(s.name, 15);
      fixedLbl.push({ id: s.id, r: { x: sx + s.labelOff.dx * k, y: sy + s.labelOff.dy * k - sz.h / 2, w: sz.w, h: sz.h } });
      return;
    }
    lblItems.push({ id: s.id, x: sx, y: sy, text: s.name, fs: 15, rank: s.lines.length > 1 ? 2 : 0 });
  });
  const sides = settings.showLabels ? solveSides(lblItems, obst, 14, 11 * GS, null, fixedLbl) : {};
  pts.forEach((s) => {
    const ls = vis(s); if (!ls.length) return;
    const [px, py] = proj(s);
    const x = X(px), y = Y(py);
    const eg = visIdx.get(s.id);
    const g = stationGlyph(s, ls, eg ? eg.at : null), GS2 = GS;   // 有倒排表就把首次出现下标一并交进去
    const R = g.size / 2 * GS2, sw = g.sw * GS2, rr = Math.max(0.4, R - sw / 2);
    const dash = g.staged ? ' stroke-dasharray="' + (3 * GS2).toFixed(1) + " " + (2 * GS2).toFixed(1) + '"' : "";
    if (g.xfer) {
      body += '<circle cx="' + x + '" cy="' + y + '" r="' + rr.toFixed(1) + '" fill="#fff" stroke="#15181D" stroke-width="' + sw.toFixed(1) + '"' + dash + "/>";
      body += '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" font-size="' + (g.glyph * GS2).toFixed(1) + '" fill="' + (s.outTransfer ? "#898989" : "#15181D") + '" font-family="Arial, sans-serif">⇄</text>';
    } else {
      body += '<circle cx="' + x + '" cy="' + y + '" r="' + rr.toFixed(1) + '" fill="#fff" stroke="#15181D" stroke-width="' + sw.toFixed(1) + '"' + dash + "/>";
      if (g.term) body += '<circle cx="' + x + '" cy="' + y + '" r="' + (0.17 * g.size * GS2).toFixed(1) + '" fill="#15181D"/>';
    }
    if (settings.showLabels) {
      let lp;
      if (s.labelOff) {
        const k = perUnit(s.labelOff.z || 15);
        lp = { x: x + s.labelOff.dx * k, y: y + s.labelOff.dy * k, anchor: "start", mid: true };
      } else {
        lp = svgLabelXY(x, y, (sides[s.id] || {}).side || "r", 14);
      }
      body += '<text class="lbl" x="' + lp.x.toFixed(1) + '" y="' + lp.y.toFixed(1) + '" text-anchor="' + lp.anchor + '"' + (lp.mid ? ' dominant-baseline="central"' : "") + ' font-family="Barlow Condensed, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0C1017" stroke="#F6F7F9" stroke-width="3.5" paint-order="stroke">' + esc(s.name) + "</text>";
    }
  });
  /* 分带边界的唯一真相就是这里画出去的那几个数：题头两行基线、图例底边行距。
     它们随导出结果一起交回去，像素审计不再猜"上 7% / 下 12%"。 */
  const TITA = 34, TITB = 52, LGw = legendGeom(visLines, W, false);
  const legend = legendSvg(visLines, LGw, 48, hh - 26, false);

  return {
    w: W, h: hh,
    bands: { titleH: TITB + 6, legendTop: LGw.rows ? hh - 26 - LGw.blockH : hh, legend: LGw.rows > 0 },
    svg: '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + hh + '" viewBox="0 0 ' + W + " " + hh + '">' +
      '<rect width="100%" height="100%" fill="#F6F7F9"/>' +
      '<text x="48" y="' + TITA + '" font-family="Barlow Condensed, PingFang SC, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#0C1017">' + esc(P.name.toUpperCase()) + "</text>" +
      '<text x="48" y="' + TITB + '" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2" fill="#6D7C8E">SUBWAY MAP STUDIO · ' + new Date().toISOString().slice(0, 10) + "</text>" +
      '<g>' + body + "</g>" + legend + "</svg>"
  };
}
/* ============================================================

   完全不动你画的地理数据，另算一套八向（横/竖/45°）排布：
     1) 站点投影到墨卡托平面并归一化
     2) 每条边的走向按初始地理方位锁定到最近的罗盘 8 向，站间统一间距 U
     3) 弹簧松弛 + 弱锚定原位置（保持整体格局）+ 非相邻节点斥力（防挤成一团）
     4) 每条边按 rmp diagonal 的公式画成"一段轴向 + 一段 45°"，尖角按
        roundCornerFactor 圆角（这里把圆角采样成折线点，好复用堆叠管线）
     5) 走廊堆叠、层栈线型、北京站型、编号牌、图例全部复用

    ? { x: B.x - Math.abs(dy) * (dx >= 0 ? 1 : -1), y: A.y }

  const P1 = { x: C.x + (A.x - C.x) / lin * rr, y: C.y + (A.y - C.y) / lin * rr };
  const P2 = { x: C.x + (B.x - C.x) / lout * rr, y: C.y + (B.y - C.y) / lout * rr };

  for (let i = 1; i <= 8; i++) {

    out.push({ x: mt * mt * P1.x + 2 * mt * t * C.x + t * t * P2.x, y: mt * mt * P1.y + 2 * mt * t * C.y + t * t * P2.y });
  }

       哪天有人顺手改一下就变成"下一次按 G 得到上一次的图" —— 克隆 1200 个点 ~0.3ms。 */
    const cp = {};

/* 标准图每次按 G 都要从原始经纬度重跑一遍松弛（1200 站实测 561~604ms，占整张导出的

   每轮顺序固定。所以按"影响结果的全部输入"做一张精确键缓存：线/站/坐标全精度字符串

   这里把导出栅格化后真数像素，按导出自己交回来的边距分三条带（题头 / 画心 / 底部
   图例）统计有墨像素、颜色数、以及有没有内容贴到画幅边沿（正常导出四周是留白的，
   贴边说明有东西顶到边界被裁了）。大图画不全就等比缩小采样，只看不存，代价控在
   4M 像素内；拿不到边距时退回 7%/88% 的猜法，并在结果里说明是分带是兜底的。 */
function inkStats(d, W, H, split) {
  const tLim = Math.max(0, Math.round(split && split.titleH != null ? split.titleH : H * 0.07));
  const bLim = Math.max(tLim, Math.round(split && split.legendTop != null ? split.legendTop : H * 0.88));
  let ink = 0, edge = 0;
  const buckets = {}, bands = { title: 0, draw: 0, legend: 0 };
  for (let y = 0; y < H; y++) {
    const isTitle = y < tLim, isLegend = y >= bLim;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (Math.abs(d[i] - PAPER_RGB[0]) > 18 || Math.abs(d[i + 1] - PAPER_RGB[1]) > 18 || Math.abs(d[i + 2] - PAPER_RGB[2]) > 18) {
        ink++;
        buckets[(d[i] >> 4) + "," + (d[i + 1] >> 4) + "," + (d[i + 2] >> 4)] = 1;
        bands[isTitle ? "title" : isLegend ? "legend" : "draw"]++;
        if (x <= 1 || x >= W - 2 || y <= 1 || y >= H - 2) edge++;
      }
    }
  }
  return { ink, px: W * H, frac: W && H ? ink / (W * H) : 1, colors: Object.keys(buckets).length, bands, edge, split: { tLim, bLim } };
}
const AUDIT_MAX_PX = 4e6;
/* 分带边界是源像素坐标，采样缩了 s 倍就得跟着缩；单独抽出来是因为"漏乘 s"
   这种错在异步渲染回调里根本测不出来，抽成纯函数就能直接断言。 */
function splitForScale(bands, s) {
  return bands && isNum(bands.titleH) && isNum(bands.legendTop)
    ? { titleH: bands.titleH * s, legendTop: bands.legendTop * s } : null;
}
function auditRaster(svg, w, h, bands, cb) {
  const img = new Image();
  let settled = false;
  const done = (r) => { if (settled) return; settled = true; clearTimeout(timer); cb(r); };
  const timer = setTimeout(() => done({ err: "浏览器 10 秒内没把 SVG 解出来" }), 10000);
  img.onload = () => {
    if (settled) return;
    const s = Math.min(1, Math.sqrt(AUDIT_MAX_PX / Math.max(1, w * h)));
    const W = Math.max(1, Math.round(w * s)), H = Math.max(1, Math.round(h * s));
    try {
      const cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      const c = cv.getContext && cv.getContext("2d");
      if (!c) throw new Error("浏览器不支持 canvas 2D");
      c.fillStyle = "#F6F7F9"; c.fillRect(0, 0, W, H);
      c.drawImage(img, 0, 0, W, H);
      /* 边界是源像素坐标，画面按 s 等比缩过采样，分带必须跟着缩，
         否则带子会整体偏上，报出来的"画心"里混着图例像素。 */
      const st = inkStats(c.getImageData(0, 0, W, H).data, W, H, splitForScale(bands, s));
      st.scale = s; st.srcW = w; st.srcH = h; st.expect = bands || null;
      done(st);
    } catch (e) { done({ err: e.message }); }
  };
  img.onerror = () => done({ err: "SVG 无法解析为图片（多半是 XML 不合法）" });
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function auditLine(name, st) {
  if (st.err) return { ok: false, html: "<b>" + esc(name) + "</b> 渲染失败：" + esc(st.err) };
  const bad = st.frac < 0.004, thin = st.frac < 0.004 || st.colors < 8;
  /* 有可见线路就一定有图例。图例带里一个像素都没有 = 分带边界和导出自己的边距
     对不上（比如缩放漏乘），此时画面数字全都不成立，必须报而不是默默放行。 */
  const noLgd = st.expect && st.expect.legend && !st.bands.legend;
  const s = (st.frac * 100).toFixed(1);
  return { ok: !thin && !noLgd, html: "<b>" + esc(name) + "</b> " + (bad ? "几乎空白：" : "画面 ") + s + "% 有墨 · " + st.colors + " 种颜色" +
    " · 题头/画心/图例 " + st.bands.title + "/" + st.bands.draw + "/" + st.bands.legend + " px" +
    (st.expect ? "（分带 " + Math.round(st.split.tLim) + "/" + Math.round(st.split.bLim) + " 来自导出边距）" : "（分带按 7%/88% 兜底）") +
    (noLgd ? " · <span style=\"color:var(--alert)\">图例带内无像素：分带边界与导出边距不符</span>" : "") +
    (st.edge > 40 ? " · <span style=\"color:var(--signal)\">有 " + st.edge + " 个像素贴到画幅边沿（可能被裁切）</span>" : "") +
    (st.scale < 1 ? " · 按 " + (st.scale * 100).toFixed(0) + "% 缩放采样" : "") };
}
/* 存档冻结：测试前后用户档必须逐字节一样。只有 updatedAt 变了说明是这期间你真的
   改了东西（那是正常的落盘，不是测试干的），其余字段变了才是事故。 */
function freezeRow() {
  if (!freezeProbe) return { ok: true, html: "<b>存档冻结</b> 没有快照可对比（当前没有打开的图纸）" };
  const now = localStorage.getItem(K_PROJ(freezeProbe.id));
  const waited = Math.max(0, Math.round((Date.now() - freezeProbe.at) / 1000));
  if (now === freezeProbe.raw) return { ok: true, html: "<b>存档冻结</b> 自检前后你的档逐字节相同（等了 " + waited + " 秒，防抖写早已落地）" };
  if (now == null) return { ok: false, html: "<b>存档冻结</b> <span style=\"color:var(--alert)\">自检之后你的档不见了（键 " + esc(K_PROJ(freezeProbe.id)) + "）</span>" };
  if (freezeProbe.raw == null) return { ok: true, html: "<b>存档冻结</b> 这份档原本还没落过盘，期间写入了第一版" };
  let a = null, b = null;
  try { a = JSON.parse(freezeProbe.raw); b = JSON.parse(now); } catch (e) { return { ok: false, html: "<b>存档冻结</b> 存档读不出 JSON：" + esc(e.message) }; }
  const keys = Object.keys(Object.assign({}, a, b));
  const diff = keys.filter((k) => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
  if (diff.length === 1 && diff[0] === "updatedAt") return { ok: true, html: "<b>存档冻结</b> 只有 updatedAt 变了（这期间你真的编辑过），内容字段一个都没动" };
  if (!diff.includes("lines") && !diff.includes("stations") && !diff.includes("center") && !diff.includes("zoom") && !diff.includes("id"))
    return { ok: true, html: "<b>存档冻结</b> 变的是 " + esc(diff.join("/")) + "，图纸内容与视图未被动过" };
  return { ok: false, html: "<b>存档冻结</b> <span style=\"color:var(--alert)\">自检改动了你的档：字段 " + esc(diff.join("/")) + "（等待 " + waited + " 秒）</span>" };
}
/* 在自检对话框里跑的异步第二幕：拿用户当前图纸真导一遍、真数像素。 */
function runPixelAudit(box) {
  box.innerHTML = '<div class="help-row"><kbd>…</kbd><span>正在把两张导出图栅格化并逐像素统计…</span></div>';
  const jobs = [["地理 SVG", () => buildSVG()], ["标准线路图 SVG", () => buildSchematicSVG()]];
  const rows = new Array(jobs.length);
  let pending = jobs.length;
  const paint = () => {
    if (pending) return;
    const fz = freezeRow();
    const bad = rows.filter((r) => !r.ok).length + (fz.ok ? 0 : 1);
    box.innerHTML = '<div class="help-row"><kbd style="min-width:34px;color:' + (bad ? "var(--alert)" : "var(--live)") + '">' + (bad ? "WARN" : "PASS") + "</kbd><span>像素审计基于当前图纸的真实导出（只读，不落盘）</span></div>" +
      rows.map((r) => '<div class="help-row"><kbd style="min-width:34px;color:' + (r.ok ? "var(--live)" : "var(--signal)") + '">' + (r.ok ? "OK" : "!!") + "</kbd><span>" + r.html + "</span></div>").join("") +
      '<div class="help-row"><kbd style="min-width:34px;color:' + (fz.ok ? "var(--live)" : "var(--alert)") + '">' + (fz.ok ? "OK" : "!!") + "</kbd><span>" + fz.html + "</span></div>";
  };
  jobs.forEach((j, i) => {
    let out = null;
    try { out = j[1](); } catch (e) { rows[i] = { ok: false, html: "<b>" + esc(j[0]) + "</b> 构建失败：" + esc(e.message) }; if (!--pending) paint(); return; }
    auditRaster(out.svg, out.w, out.h, out.bands, (st) => { rows[i] = auditLine(j[0], st); if (!--pending) paint(); });
  });
}
function rasterize(out, want, name) {
  const scale = pngScaleFor(out.w, out.h, want);
  const W = Math.round(out.w * scale), H = Math.round(out.h * scale);
  if (scale !== (want || 1)) toast("画幅太大，PNG 倍率 " + want + "× → " + scale + "×（" + W + "×" + H + "px 已到浏览器画布上限）");
  const img = new Image();
  let settled = false;
  const fail = (why) => { if (settled) return; settled = true; toast("PNG 导出失败：" + why, "bad"); };
  const timer = setTimeout(() => fail("浏览器没能解析这张 SVG（超时）"), 12000);
  img.onload = () => {
    if (settled) return;
    let ctx = null, cv = null;
    try {
      cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      ctx = cv.getContext && cv.getContext("2d");
    } catch (e) { }
    if (!ctx) { clearTimeout(timer); settled = true; toast("PNG 导出失败：画布 " + W + "×" + H + " 超出浏览器上限，请在设置里降低倍率", "bad"); return; }
    ctx.fillStyle = "#F6F7F9"; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    /* 缩略采样判空白：直接读大图会把主线程卡住 */
    let inkRatio = 1;
    try {
      const t = document.createElement("canvas");
      t.width = 64; t.height = 64;
      const tc = t.getContext("2d");
      tc.fillStyle = "#F6F7F9"; tc.fillRect(0, 0, 64, 64);
      tc.drawImage(img, 0, 0, 64, 64);
      inkRatio = blankFraction(tc.getImageData(0, 0, 64, 64).data);
    } catch (e) { inkRatio = 1; }
    cv.toBlob((b) => {
      if (settled) return; settled = true; clearTimeout(timer);
      if (!b) { toast("PNG 导出失败：浏览器拒绝生成 " + W + "×" + H + " 的画布，请在设置里降低 PNG 倍率", "bad"); return; }
      download(name, b);
      const pct = (inkRatio * 100).toFixed(1);
      if (inkRatio < 0.004) toast("PNG 已生成但几乎是空白的（有墨像素仅 " + pct + "%）：这张图可能没有内容，或浏览器没能解析 SVG 里的字体", "bad");
      else toast("已导出 PNG " + W + "×" + H + "px" + printHint(W, H) + " · " + fmtBytes(b.size) + " · 画面 " + pct + "%", "good");
    }, "image/png");
  };
  img.onerror = () => { clearTimeout(timer); fail("SVG 无法被解析为图片"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(out.svg);
}

function exportSvg() {
  try {
    const { svg } = buildSVG();
    download(fname("svg"), new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    toast("已导出矢量图 SVG", "good");
  } catch (e) { toast("导出失败：" + e.message, "bad"); }
}
function exportPng() {
  let out;
  try { out = buildSVG(); } catch (e) { return toast("导出失败：" + e.message, "bad"); }
  rasterize(out, settings.pngScale || 2, fname("png"));
}

/* 方向键微调：选中站点后按"屏幕像素"挪，而不是按固定经纬度 —— 1px 在任何缩放
   下都是看得见的一小步，而画线路本来就是屏幕上的事。Shift 走 10px 大步。
   连按只记一次撤销步（隔 600ms 或换站点才开新一轮），否则按 ten 下方向键
   就要按十次 Ctrl+Z 才能回到原位。 */
let nudgeAt = 0, nudgeId = null;
function nudgeStation(dx, dy) {
  const st = station(sel.station); if (!st) return false;
  navClose();
  const now = Date.now();
  if (nudgeId !== st.id || now - nudgeAt > 600) pushHistory();
  nudgeId = st.id; nudgeAt = now;
  const p = map.latLngToContainerPoint([st.lat, st.lng]);
  const q = map.containerPointToLatLng({ x: p.x + dx, y: p.y + dy });
  st.lat = q.lat; st.lng = q.lng;
  renderMap(); renderStnList(); renderInspector(); renderStatus(); markDirty();
  return true;
}
function bindKeys() {
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) {
      if (e.key === "Escape") { if (nav && $("#navCard").contains(t)) navClose(); else t.blur(); }
      return;
    }
    if (document.querySelector(".scrim")) { if (e.key === "Escape") document.querySelector(".scrim").remove(); return; }
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (meta && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
    if (meta && e.key.toLowerCase() === "s") { e.preventDefault(); exportJson(); return; }
    if (e.shiftKey && e.key.toLowerCase() === "t") { e.preventDefault(); showSelfTest(); return; }
    if (meta) return;
    /* 只有在"选中了站点 + 选择工具"时才接管方向键，否则留给 Leaflet 平移地图 */
    if (sel.station && tool === "select" && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
      const dy = e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0;
      if (nudgeStation(dx, dy)) { e.preventDefault(); return; }
    }
    switch (e.key.toLowerCase()) {
      case "v": setTool("select"); break;
      case "a": setTool("add"); break;
      case "l": addLine(); toast("已新建线路，按 A 开始点站"); break;
      case "n": focusStnList(); break;
      case "f": fitAll(); break;
      case "g": openDiagram(); break;
      case "r": openNavigation(); break;
      case "?": openHelp(); break;
      case "c": setTool(tool === "link" ? "select" : "link"); toast(tool === "link" ? "连线模式：先布置车站，再切到「拖线连接」，从圆点拖到另一站；确认连接后保存" : "已退出连线模式"); break;
      case "escape": navClose(); linkReset(); pendingInsert = null; setTool("select"); deselect(); break;
      case "delete": case "backspace":
        if (sel.station) deleteStation(sel.station);
        else if (sel.line) deleteLine(sel.line);
        break;
      case "+": case "=": viewByUser(); map.zoomIn(); break;
      case "-": viewByUser(); map.zoomOut(); break;
      default: return;
    }
    e.preventDefault();
  });
}

/* ============================================================
   18.5 内置回归自检 selfTest()
   把历轮靠手工发现的问题固化成可重跑的断言，给以后的优化当护栏：
     · 迟滞分数泄漏进淘汰判据（hitLine 必须独立于 score 累计）
     · layerGroup 记账僵尸（marker.remove() 不清 group，切一次工具涨一截）
     · 站点/铭牌对象池复用后仍要同步选中态、可拖性，并且不许留僵尸 marker
     · 把手池化后每帧重绑事件不许叠加监听，且"建点/拖回弦线撤销/双击删除"仍要成立
     · 求解器改造必须与暴力版逐字节等价；拖拽隔帧重排只许降频不许断供
     · 编号牌必须落在自己那条色带上、朝向正、不压车站，且两处导出跟随开关
     · 方向键微调按像素走、整轮连按只记一次撤销；自检不许污染用户的撤销栈
     · 车站 glyph 只有一套口径（stationGlyph）：导出的圆点不许比图上的大，
       且要随导出画布的密度自适配，否则稠密图里点压点、编号牌无处可放
     · 图例先限行数再分栏，占掉的高度算进下边距；导出必须是合法 XML（PNG 走
       Image+canvas，XML 一错就静默出白图，比报错更难发现）
     · PNG 倍率要钳在浏览器画布面积上限内，并且报得出打印尺寸
     · PNG 要能判"是不是几乎一张白图"（toBlob 成功 ≠ 画面上有东西）
     · 像素审计自己也要可信：全纸色必判空白、单色低信息量判可疑、贴边能点出
     · joinSegs 去重阈值在经纬度空间会吃掉真实站点（里程 7.5→5.9 那次）
     · 弯道 along/normal 往返失真、Catmull-Rom 不经过控制点
     · 示意化排布偏离八向网格
     · 存档层三件事：坏数据要拦住（null 坐标不许被洗成 0）、坏主档要回滚到 prev、
       写入失败时指示灯不许谎称"已保存"

    t("编号牌避让网格：整数格表、字符串格表、全扫三份答案逐点相同（含格边与空/单点输入）", () => {
      /* badgeClearance 的整数格表（第 27 轮）取代了每格一个字符串键的表；两者加上
         query.brute 全扫必须给出同一个"离最近圆边的距离"。断言的敏感点是格边界：
         环walk、clamp、minIy*W+ix 的下标换算错一格，这里就会当场不同 ——
         历史上这类错误被"网格 25.37 vs 全扫 20.30"抓到过一次，所以三份都要比。 */
      const bad = [];
      const savedP2 = P, savedSel2 = sel, savedView2 = [map.getCenter(), map.getZoom()], savedMode = badgeIntGrid;
      try {
        inSelfTest = true;
        P = synthProject(240, 6); sel = { line: P.lines[0].id, station: null };
        map.setView(P.center, 13, { animate: false }); renderMap();
        const avoid = collectVisible().map((v) => ({ x: v.px.x, y: v.px.y, r: v.size / 2 + 5 }));
        badgeIntGrid = true; const qi = badgeClearance(avoid);
        badgeIntGrid = false; const qs = badgeClearance(avoid);
        const pxAt = (i) => { const a = (i * 2654435761) >>> 0; return { x: (a % 1300) - 60, y: ((a >>> 12) % 900) - 60 }; };
        let diffIS = 0, diffIB = 0;
        for (let i = 0; i < 1200; i++) {
          const p = pxAt(i);
          if (qi(p.x, p.y) !== qs(p.x, p.y)) diffIS++;
          if (qi(p.x, p.y) !== qi.brute(p.x, p.y)) diffIB++;
        }
        let edge = 0;
        for (let g = 0; g < 40; g++) {
          const x = g * BADGE_GRID_G, y = (g % 7) * BADGE_GRID_G;
          if (qi(x, y) !== qs(x, y) || qi(x, y) !== qi.brute(x, y)) edge++;
        }
        if (badgeClearance([])(10, 10) !== Infinity) bad.push("空 avoid 应给 Infinity");
        const oneQ = badgeClearance([{ x: 5, y: 6, r: 3 }]);
        if (oneQ(5, 6) !== -3 || oneQ(5, 6) !== oneQ.brute(5, 6)) bad.push("单点 avoid 不对");
        const neg = badgeClearance([{ x: 5, y: 6, r: 3 }, null]);
        if (neg(5, 6) !== -3) bad.push("avoid 里的空洞没被跳过（应给 -3，实得 " + neg(5, 6) + "）");
        /* 格数超上限 ⇒ 整数表放不下，必须退回字符串格表。这条就是盯那个退回分支：
           坐标铺到 ±2e7 像素（G=64 时格数远超 10 万上限），照样要和 brute 全扫逐点相同。
           没有这一条，fallback 分支就是死代码 —— 平时永远走整数表，坏了也没人发现。 */
        const far = [{ x: -2e7, y: -1.5e7, r: 7 }, { x: 2e7, y: 1.6e7, r: 9 }, { x: 0, y: 0, r: 4 }];
        const qFar = badgeClearance(far);
        let farBad = 0;
        for (let i = 0; i < 60; i++) {
          const fx = (i * 7919) % 4000 - 2000, fy = (i * 104729) % 4000 - 2000;
          if (qFar(fx, fy) !== qFar.brute(fx, fy)) farBad++;
        }
        if (farBad) bad.push("格数超限退回字符串表后有 " + farBad + "/60 点与全扫不一致");
        /* 同一批远坐标在整数档下也必须走通（要么建成、要么同样退回），不能抛错也不能 Infinity 乱给 */
        badgeIntGrid = true;
        const qFar2 = badgeClearance(far);
        let farBad2 = 0;
        for (let i = 0; i < 60; i++) {
          const fx = (i * 7919) % 4000 - 2000, fy = (i * 104729) % 4000 - 2000;
          if (qFar2(fx, fy) !== qFar2.brute(fx, fy)) farBad2++;
        }
        if (farBad2) bad.push("远坐标 + 整数档有 " + farBad2 + "/60 点与全扫不一致");
        if (diffIS) bad.push("整数格表与字符串格表 " + diffIS + "/1200 点不一致");
        if (diffIB) bad.push("网格与全扫 " + diffIB + "/1200 点不一致");
        if (edge) bad.push("格边上 " + edge + "/40 点三份不一致");
        return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；")
          : avoid.length + " 个圆 × 1200 点：整数格表＝字符串格表＝全扫；格边 40 点同样一致；空/单点/含空洞输入正确；格数超限的远坐标两档各 60 点＝全扫（fallback 分支有覆盖）" };
      } catch (e) {
        return { ok: false, detail: "抛错：" + String(e && e.message).slice(0, 140) };
      } finally {
        inSelfTest = true; badgeIntGrid = savedMode;
        P = savedP2; sel = savedSel2; clearMarkerPools();
        map.setView(savedView2[0], savedView2[1], { animate: false });
        renderAll();
      }
    });

    t("编号牌避让的站点圆查询：网格与全扫逐位相同，锚点结论一条不许差", () => {
      /* 牌只有几张，可它每帧要把上千个车站圆按 ~25 个候选位各问一遍（地图 + 导出两条路都这样）。
         换成均匀网格 + 有界扩张之后，必须**一个字节都不差**：判据不是"看起来差不多"，
         而是同一批算术（Math.hypot(x-c.x, y-c.y) - c.r）取同一个 min，只是不再每个点全扫。
         四层：① 随机点纯函数差分；② 退化形态（空集 / 单圆 / 极远点 / 圆心）；
         ③ 整条锚点管线（FromSegs 与 Curved 兜底都走一遍）；④ 密铺到每 6px 一个圆 ——
         网格扩张上界最容易在这种场景漏圈。 */
      const savedP = P, savedSel = sel, savedView = [map.getCenter(), map.getZoom()];
      const bad = [];
      let nQ = 0, anSame = 0, nAvoid = 0, denseN = 0, denseSame = false;
      try {
        inSelfTest = true;
        const pts = [];
        for (let i = 0; i < 900; i++) pts.push({ x: (i * 37) % 1600 + (i % 7) * 0.5, y: (i * 61) % 900 + (i % 5) * 0.25, r: 8 + (i % 9) });
        const q = badgeClearance(pts);
        for (let t = 0; t < 300 && !bad.length; t++) {
          const x = (t * 41) % 1700, y = (t * 29) % 1000;
          if (q(x, y) !== q.brute(x, y)) { bad.push("第 " + t + " 个点不等：网格 " + q(x, y) + " vs 全扫 " + q.brute(x, y)); break; }
          nQ++;
        }
        const q0 = badgeClearance([]);
        if (q0(5, 5) !== Infinity) bad.push("空圆集应给 Infinity");
        const q1 = badgeClearance([{ x: 10, y: 10, r: 4 }]);
        if (q1(10, 10) !== -4) bad.push("圆心处应正好是 -r，实得 " + q1(10, 10));
        if (q1(4000, 3000) !== q1.brute(4000, 3000)) bad.push("远离唯一那个圆时不等");
        P = synthProject(240, 4); sel = { line: P.lines[0].id, station: null };
        map.setView(P.center, 12, { animate: false }); renderMap();
        const avoid = collectVisible().map((v) => ({ x: v.px.x, y: v.px.y, r: v.size / 2 + 5 }));
        nAvoid = avoid.length;
        if (nAvoid < 100) bad.push("锚点差分只有 " + nAvoid + " 个车站圆，用例太瘦");
        const qg = badgeClearance(avoid);
        P.lines.forEach((l) => {
          const geo = lineGeoPx[l.id]; if (!geo || !geo.length) return;
          const a1 = badgeAnchorFromSegs(geo, 26, avoid) || badgeAnchorCurved(ribbonPts(geo), 26, avoid);
          const a2 = badgeAnchorFromSegs(geo, 26, qg) || badgeAnchorCurved(ribbonPts(geo), 26, qg);
          if (JSON.stringify(a1) !== JSON.stringify(a2)) bad.push(l.id + " 的锚点不等：" + JSON.stringify(a1) + " vs " + JSON.stringify(a2));
          else anSame++;
        });
        if (anSame < 3) bad.push("只对 " + anSame + " 条线的锚点做了差分");
        const dense = [];
        for (let x = 0; x < 700; x += 6) for (let y = 0; y < 400; y += 6) dense.push({ x: x, y: y, r: 9 });
        denseN = dense.length;
        const dq = badgeClearance(dense);
        denseSame = true;
        for (let t = 0; t < 60; t++) {
          const x = (t * 11.5) % 700, y = (t * 7.25) % 400;
          if (dq(x, y) !== dq.brute(x, y)) { denseSame = false; bad.push("密铺第 " + t + " 个点不等"); break; }
        }
        return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；") :
          nQ + " 个随机查询 + " + anSame + " 条线锚点（" + nAvoid + " 个车站圆）+ 密铺 " + denseN + " 圆 " + (denseSame ? "60 点" : "0") + " 点：网格与全扫逐位相同；空集 Infinity / 圆心 -r / 单圆远点一致" };
      } catch (e) {
        return { ok: false, detail: "抛错：" + e.message };
      } finally {
        inSelfTest = true;
        P = savedP; sel = savedSel; clearMarkerPools();
        map.setView(savedView[0], savedView[1], { animate: false });
        renderAll();

        const { segs } = lineShape(l, (x) => map.latLngToContainerPoint([x.lat, x.lng]));
        const s = segs[0], key = bendKey(s.a, s.b);
        const plus = handlePool[hk(l.id, key, "+")];
        const cnt = () => { let n = 0; layerHandle.eachLayer(() => n++); return n; };
        const expectSpots = segs.length;                       // 全直时=段数，每段一个"+"
        const before = cnt();
        /* 监听有没有叠加，改成"再渲染 6 遍前后各事件的监听数一模一样"。
           原来读的是 Leaflet 内部结构 mk._events[type].length —— 那是私有形状，
           去掉每帧 off()+重绑之后它不再等于我以为的东西，判据自己变成了被测对象的
           副产品。公开 API 只有 listens()，而且"前后相等"才是我真正想钉的性质：
           重渲染不许往同一个 marker 上再挂一份处理器。 */
        const EV = ["dragstart", "drag", "dragend", "dblclick", "click"];
        const lcnt = (mk) => EV.map((t) => mk.listens(t, true)).join(",");
        const lc0 = lcnt(plus);
        for (let i = 0; i < 6; i++) renderHandles();
        const afterRenders = cnt();
        const noDup = lcnt(plus) === lc0 && plus.listens("drag", true) > 0;
        const chordMid = map.containerPointToLatLng({ x: (s.A.x + s.B.x) / 2, y: (s.A.y + s.B.y) / 2 });
        const jump = (mk, dx, dy) => { const p = map.latLngToContainerPoint(mk.getLatLng()); return map.containerPointToLatLng({ x: p.x + dx, y: p.y + dy }); };
        plus.fire("dragstart"); plus.setLatLng(jump(plus, 26, -26)); plus.fire("drag"); plus.fire("dragend");
        const created = Array.isArray(l.bends[key]) && l.bends[key].length === 1;
        const b0 = handlePool[hk(l.id, key, "b0")];
        const off = handlePool[hk(l.id, key, "+")];

        /* 回归点（用户报"不能多个弯曲点"）：同一根 "+" 把手第二次拖，必须还能造出
           **第二个**点。上一版这里只演一次建点，所以"slot 闭包状态跨趟残留"（去掉每帧
           off()+重绑之后才出现的可变状态）把用户挡在"一段只能有一个弯道"上，

        const off2 = handlePool[hk(l.id, key, "+")];

    t("八向折线：出格段都是被网格段夹住的短圆角", () => {
      const isGrid = (u, v) => { const dx = Math.abs(v.x - u.x), dy = Math.abs(v.y - u.y); return dx < 1e-6 || dy < 1e-6 || Math.abs(dx - dy) < 1e-6; };
      let checked = 0, bad = 0, why = "";
      /* 单条折线只有一个拐角 → 至多一段圆角；整图折线有 N 个拐角 → N 段。
         所以正确的性质不是"总跳变次数≤2"，而是：每段出格都短（≤ 9 个采样）
         且不贴端点（两端都被网格段夹住）。 */
      const check = (p, tag) => {
        if (p.length < 2) return;
        checked++;
        const runs = [];
        let cur = 0;
        for (let i = 0; i < p.length - 1; i++) {
          if (isGrid(p[i], p[i + 1])) { if (cur) { runs.push(cur); cur = 0; } }
          else cur++;
        }
        if (cur) runs.push(cur);
        if (isGrid(p[0], p[1]) === false || isGrid(p[p.length - 2], p[p.length - 1]) === false) { bad++; why = tag + " 出格段贴在端点"; return; }
        const over = runs.filter((n) => n > 9);
        if (over.length) { bad++; why = tag + " 圆角段过长 " + over.join(","); return; }
        const arcs = p.length - 1 - runs.reduce((a, n) => a + n, 0);
        if (arcs < 2) { bad++; why = tag + " 无网格段"; }
      };
      for (let i = 0; i < 60; i++) {
        const A = { x: 0, y: 0 }, B = { x: (i % 9) * 37 - 140, y: ((i * 7) % 11) * 31 - 150 };
        if (Math.abs(B.x) < 1 && Math.abs(B.y) < 1) continue;
        const p = diagPolyline(A, B, 13);
        if (p.length === 2) { checked++; continue; }
        check(p, "随机" + i);
      }
      const pos = layoutSchematic(); const shapes = schematicShapes(pos);
      Object.keys(shapes).forEach((id) => check(shapes[id], "整图"));
      return { ok: checked > 20 && bad === 0, detail: checked + " 条折线，违规 " + bad + (why ? "（" + why + "）" : "") };
    });

    t("老档坐标 GCJ-02 → WGS-84：反算精度到亚毫米，且转换+开套合后每站屏幕位置一点不动", () => {
      const bad = [];
      let worstM = 0, corrM = 0;
      /* 1) 反算精度：对四个境内城市做 正算→反算 往返，必须贴回原点到 1e-9 度（<0.1 mm） */
      [["39.9042", "116.4074"], ["31.2304", "121.4737"], ["23.1291", "113.2644"], ["30.5728", "104.0668"]]
        .forEach((c) => {
          const la = +c[0], ln = +c[1];
          const back = gcj2wgs.apply(null, wgs2gcj(la, ln));
          if (Math.abs(back[0] - la) > 1e-9 || Math.abs(back[1] - ln) > 1e-9) bad.push("往返误差过大 " + la + "," + ln + " → " + back);
        });
      /* 2) 境外绝不允许被"修正"（伦敦原样返回） */
      const lon = gcj2wgs(51.5008, -0.1246);
      if (lon[0] !== 51.5008 || lon[1] !== -0.1246) bad.push("境外坐标被改了：" + lon);
      /* 3) 主不变量：模拟一份"老档"（存的是 GCJ 数值），关套合记下画面像素；
            转换 + 开套合之后，每站相对视图中心的位置必须与之前一致（一档平移是近似，残差按平移量的比例判）。
            这条同时证明两件事：用户的老图不会一夜之间跑偏，且转换真的把数值搬回 WGS。 */
      const savedP = P, savedSel = { line: sel.line, station: sel.station }, savedBase = settings.basemap;
      const savedFit = settings.datumFit, savedLock = viewLockUntil, savedHist = hist, savedFut = future;
      try {
        const p = synthProject(6, 1);
        P = p; sel.line = p.lines[0].id; sel.station = null; hist = []; future = [];
        Object.keys(P.stations).forEach((id) => {
          const st = P.stations[id], g = wgs2gcj(st.lat, st.lng);   /* 老档口径：存的是 GCJ 数值 */
          st.lat = g[0]; st.lng = g[1];
        });
        settings.basemap = "amap"; settings.datumFit = false; applyBasemap();
        viewLockUntil = Infinity;
        map.setView(P.center, 14, { animate: false }); renderAll();
        const z = map.getZoom();
        const rel = (lat, lng) => { const w = map.project([lat, lng], z), o = map.project(map.getCenter(), z); return { x: w.x - o.x, y: w.y - o.y }; };
        const before = Object.keys(P.stations).map((id) => { const s = P.stations[id]; const w = rel(s.lat, s.lng); return { id: id, x: w.x, y: w.y, lat: s.lat, lng: s.lng }; });
        if (!convertProjectGcjToWgs()) bad.push("转换没执行（老档口径应该能转）");
        const movedM = Math.max.apply(null, before.map((b) => metersBetween([b.lat, b.lng], [P.stations[b.id].lat, P.stations[b.id].lng])));
        if (!(movedM > 200 && movedM < 700)) bad.push("数值搬动量级不对：" + Math.round(movedM) + " m（该在 GCJ 偏移量级）");
        settings.datumFit = true; applyBasemap(); applyDatumShift();
        const sh = datumPixelShift();
        const worst = Math.max.apply(null, before.map((b) => {
          const s = P.stations[b.id], w = rel(s.lat, s.lng);
          return Math.hypot(w.x - b.x, w.y - b.y);
        }));
        /* 一档平移是按图中心的近似：残余就是 δ 场在图幅内的变化（另一条断言量得 7 km 内 13.8 m）。
           所以按"相对被修正量的比例"判，而不是要求 0 —— 要求 0.05px 是把近似当精确，测不出真 bug。 */
        const shMag = Math.hypot(sh.x, sh.y);
        const mPerPx = 2 * Math.PI * 6378137 * Math.cos(map.getCenter().lat * Math.PI / 180) / (256 * Math.pow(2, map.getZoom()));
        worstM = worst * mPerPx; corrM = gcjMetersAt(map.getCenter().lat, map.getCenter().lng);

    t("拖拽重排的隔帧策略：超支不断供、均摊回到预算内", () => {
      const B = REFLOW_BUDGET_MS, CAP = REFLOW_MAX_EVERY;
      const bad = [];
      for (let cost = 0; cost <= 200; cost += 0.5) {
        const s = reflowStrideFor(cost);
        if (cost <= B && s !== 1) bad.push("预算内却隔帧 " + cost);
        if (s < 1 || s > CAP) bad.push("步长出界 " + cost + "→" + s);
        if (s < CAP && cost / s > B + 1e-9) bad.push("均摊仍超预算 " + cost + "/" + s);
        if (reflowStrideFor(cost + 0.5) < s) bad.push("非单调 " + cost);
      }
      /* 关键性质：任意连续 every 帧里恰好一次全局重排 —— 再贵也不断供。
         旧策略是超预算就整段拖拽都不再重排，大图拖起来站名全程不躲。
         总次数是 floor(40/every)：帧号从 1 起算，末尾凑不满的那一格没有重排。 */
      for (const every of [1, 2, 3, CAP]) {
        let tot = 0;
        for (let f = 1; f <= 40; f++) if (reflowDueNow(f, every)) tot++;
        if (tot !== Math.floor(40 / every)) bad.push("every=" + every + " 40 帧应 " + Math.floor(40 / every) + " 次，实际 " + tot);
        for (let start = 1; start + every - 1 <= 40; start++) {
          let due = 0;
          for (let f = start; f < start + every; f++) if (reflowDueNow(f, every)) due++;
          if (due !== 1) bad.push("every=" + every + " 窗口[" + start + "," + (start + every - 1) + "] 重排 " + due + " 次");
        }
      }
      if (reflowDueNow(1, 0) !== true || reflowDueNow(1, 1) !== true) bad.push("stride≤1 必须每帧重排");
      const worst = reflowStrideFor(1000);
      return { ok: !bad.length && worst === CAP, detail: bad.length ? bad.slice(0, 3).join("；") : "0–200ms 全曲线通过；1000ms→隔 " + worst + " 帧（不断供）" };

        if (!(nIn > 0 && nIn < vis.length)) bad.push("脏名单覆盖 " + nIn + "/" + vis.length + " 个站：要么白排全图，要么根本没排");
        const before = Object.assign({}, lastSides), beforeHit = Object.assign({}, lastHit);
        /* 对照这一侧必须先破掉两级缓存。#35/#36 给铭牌加的缓存让"几何一字未动的
           全量重画"接近零成本，拿它当分母，局部重排就永远"慢 5 倍"—— 实测第一条
           毫秒闸门就是这么红的（69.9ms vs 12.9ms，而那 12.9ms 里绝大部分是缓存命中）。
           这条断言要量的是同一个 DOM 重建下"解 k 个"与"解 n 个"的真实差，
           所以每次全量前把整层跳过 + 求解结果缓存一起作废，回到加缓存之前的语义。 */
        const cold = () => { lblSig = null; lblOut = null; lblKey = null; };
        const boxesOf = (sidesObj) => vis.filter((v) => !v.st.labelOff).map((v) =>
          ({ id: v.st.id, in: inRegion(v), r: labelRect(v.px.x, v.px.y, sidesObj[v.st.id] || "r", labelSize(v.st.name, fsOf(v)), 10) }));
        const hitIds = (boxes) => boxes.filter((b) => labelObstacles.some((pl) => {
          for (let i = 0; i < pl.length - 1; i++) if (segHitsRect(pl[i], pl[i + 1], b.r)) return true;
          return false;
        })).map((b) => b.id + (b.in ? "@" : "!"));
        const oldHits = new Set(hitIds(boxesOf(before)));
        const runPart = () => { lastSides = Object.assign({}, before); lastHit = Object.assign({}, beforeHit); const a = performance.now(); renderLabels(vis, dirty); return performance.now() - a; };
        const runFull = () => { cold(); lastSides = Object.assign({}, before); lastHit = Object.assign({}, beforeHit); const a = performance.now(); renderLabels(vis); return performance.now() - a; };
        runPart(); const afterPart = Object.assign({}, lastSides);
        runFull(); const afterFull = Object.assign({}, lastSides);
        /* ① 局部性：脏名单扫不到的铭牌，方位一个都不许动 */
        const drifted = vis.filter((v) => !inRegion(v) && before[v.st.id] && afterPart[v.st.id] !== before[v.st.id]);
        if (drifted.length) bad.push("区域外有 " + drifted.length + " 个铭牌被挪动，局部重排失效");
        /* ② 安全性：区域外不能因为这次改动新撞上障碍 */
        const newOut = hitIds(boxesOf(afterPart)).filter((s) => s.endsWith("!") && !oldHits.has(s));
        if (newOut.length) bad.push("区域外新撞上障碍：" + newOut.slice(0, 3).join(","));
        /* ③ 质量：局部解不能重排"钉子户"邻居，所以脏区边界上允许极少数铭牌
               暂时压线；松手时 mouseup 会走一次全量重排，成果图和最终画面不受影响
               （那是结构保证的，不在这条断言里量——量它要先重算标签实测宽度，
               两次数字根本不在同一基准上）。 */
        const cin = (sidesObj) => hitIds(boxesOf(sidesObj)).filter((s) => s.endsWith("@")).length;
        const hp = cin(afterPart), hf = cin(afterFull);
        const tol = Math.max(1, Math.ceil(nIn * 0.12));
        if (hp > hf + tol) bad.push("区域内压线 " + hp + " 个 > 全量 " + hf + " + 容差 " + tol);
        if (!(nIn <= vis.length * 0.6)) bad.push("脏区里 " + nIn + " 个铭牌 ≥ 60% 的标签，局部重排没省下多少");
        /* ④ 省了多少工作：硬指标用"交给求解器的铭牌数"——求解是 Θ(k²)，k 降下来
               就是真的省；隐藏标签页里计时噪声能有 ±20%，拿毫秒当闸门只会误报。
               耗时照样交错测出来报给人看，只留一条很松的倒退闸门（慢过 60% 说明
               脏名单算错了，像上一版那样把冷启动的 90 段欠账也算进去）。 */
        const origSolve = window.solveSides;
        let maxItems = 0, partN = 0, fullN = 0;
        window.solveSides = function (items) { if (items && items.length > maxItems) maxItems = items.length; return origSolve.apply(null, arguments); };
        const rp = [], rf = [];
        try {
          for (let i = 0; i < 3; i++) {
            maxItems = 0; rp.push(runPart()); partN = maxItems;
            maxItems = 0; rf.push(runFull()); fullN = maxItems;
          }
        } finally { window.solveSides = origSolve; }
        const med = (x) => x.slice().sort((a, b) => a - b)[1];
        const msPart = +med(rp).toFixed(2), msFull = +med(rf).toFixed(2);
        if (!(partN > 0 && partN <= fullN * 0.5)) bad.push("交给求解器的铭牌只从 " + fullN + " 降到 " + partN + "，没省下多少工作");
        /* 原来这里是一条比值闸门 `msPart > msFull * 1.6` 就报警。它量的是"局部比全量便宜"，
           而第 17~19 轮把全量重排砍掉一大半之后，这个比值不再说明问题：局部那条路要先算
           脏名单、把邻居的旧框塞回障碍，固定开销摊不掉，全量反而可以直接一把解 —— 实测
           局部 40.5ms / 全量 20.3ms，两次跑都是这个形状，而局部自己的绝对值并没有变慢
           （历史基线 31~44ms）。所以硬指标换回确定量（交给求解器的铭牌数，上面已经断言
           partN ≤ fullN/2）+ 一条只看"绝对失控"的上限：局部超过 150ms 才说明脏名单算错了
           （上一版把冷启动欠账也算进脏名单时，这里量到的是几百毫秒），比值只报给人看。 */
        if (msPart > 150) bad.push("局部重排绝对耗时失控：" + msPart + "ms（脏名单可能算错了）");
        /* ⑤ 真实拖拽里局部分支确实被走到，而不是每帧都退回全量（那样它就是死代码） */
        const savedRL2 = renderLabels;
        let partRuns = 0, fullRuns = 0;
        try {
          renderLabels = function (v, d) { if (d && d.length) partRuns++; else fullRuns++; return savedRL2(v, d); };
          startDragProbe();
          for (let i = 0; i < 8; i++) { st.lat += 0.0012 * (i % 2 ? -1 : 1); st.lng += 0.0009; dragFrameWork(st.id); }
        } finally { renderLabels = savedRL2; }
        if (!partRuns) bad.push("真实拖拽 8 帧全退回全量，局部重排是死代码");
        /* 隔帧步长是探测出来的，慢机器上 8 帧里可能只排 2 次，所以按步长给下限 */
        const every = reflowEvery;
        if (partRuns + fullRuns < Math.max(1, Math.floor(8 / every) - 1)) bad.push("8 帧（隔 " + every + " 帧）只重排了 " + (partRuns + fullRuns) + " 次，用例没跑到路");
        info = "10×24 网格挪 1 站：" + nIn + "/" + vis.length + " 个铭牌进重排，" + (vis.length - nIn) + " 个原样钉住；" +
          "求解器实收 全量 " + fullN + " → 局部 " + partN + " 个；区域内压线 局部 " + hp + " / 全量 " + hf + "（容差 " + tol + "）；" +
          "耗时中位数 局部 " + msPart + "ms vs 全量（已破缓存）" + msFull + "ms；真实拖拽 8 帧走局部 " + partRuns + " 次 / 全量 " + fullRuns + " 次";
        return { ok: !bad.length, detail: bad.length ? bad.slice(0, 3).join("；") : info };
      } finally {
        inSelfTest = true;   // 这条测完了不能摘标志：后面的测试还靠它压住 toast 与落盘
        P = savedP2; sel = savedSel2;
        clearMarkerPools(); startDragProbe();
        renderAll();
      }
    });

    t("编号牌落在自己那条线上、朝向正、不压车站、无僵尸", () => {
      const savedB = settings.showBadges;
      try {
        settings.showBadges = true;
        renderMap();
        const ids = Object.keys(badgePool);
        const dom = document.querySelectorAll("#map .ln-badge").length;
        let worstOn = 0, minClr = Infinity, notUpright = 0, wrongText = 0;
        ids.forEach((id) => {
          const l = line(id), mk = badgePool[id];
          if (!l || !mk) { worstOn = 999; return; }
          const p = map.latLngToContainerPoint(mk.getLatLng());
          const os = lineGeoPx[id] || [];
          let d = Infinity;
          os.forEach((o) => {
            for (let j = 0; j < o.pts.length - 1; j++) {
              const a = o.pts[j], b = o.pts[j + 1];
              const L2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2 || 1;
              const u = Math.max(0, Math.min(1, ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / L2));
              d = Math.min(d, Math.hypot(p.x - (a.x + u * (b.x - a.x)), p.y - (a.y + u * (b.y - a.y))));
            }
          });
          worstOn = Math.max(worstOn, d);
          Object.values(P.stations).forEach((s) => {
            const q = map.latLngToContainerPoint([s.lat, s.lng]);
            minClr = Math.min(minClr, Math.hypot(p.x - q.x, p.y - q.y) - 15);   // 15 = 最大车站圆半径
          });
          const el = mk.getElement();
          const span = el && el.querySelector(".ln-badge");
          const deg = span ? parseFloat((span.style.transform.match(/rotate\((-?[\d.]+)deg\)/) || [0, "0"])[1]) : 999;
          if (!(deg >= -90 && deg <= 90)) notUpright++;
          if (span && span.textContent !== String(l.badge)) wrongText++;
        });
        settings.showBadges = false;
        renderMap();
        const offDom = document.querySelectorAll("#map .ln-badge").length;
        const offPool = Object.keys(badgePool).length;
        settings.showBadges = true; renderMap();
        const visLines = P.lines.filter((l) => l.visible && l.stations.length >= 2).length;
        const ok = ids.length > 0 && dom === ids.length && worstOn < 1.5 && minClr > -8 &&
          notUpright === 0 && wrongText === 0 && offDom === 0 && offPool === 0 && ids.length <= visLines;
        return { ok, detail: ids.length + " 张牌：离线最远 " + worstOn.toFixed(2) + "px / 距车站最小余量 " + minClr.toFixed(1) +
          "px / 朝向不正 " + notUpright + " / 文字错 " + wrongText + " / 关掉后 DOM " + offDom + " 池 " + offPool };
      } finally {
        settings.showBadges = savedB === undefined ? true : savedB;
        renderMap();
      }
    });

    t("两处 SVG 导出的编号牌与开关同步，且导出里车站圆点不互相盖", () => {
      const savedB = settings.showBadges;
      const countBadges = (svg) => (svg.match(/class="lnb"/g) || []).length;
      /* 圆点重叠直接读导出自己写出来的 <circle>：外沿 = r + 半个描边。
         以前导出另写了一份尺寸公式（比图上大 ~1.7 倍），稠密图里点压点。 */
      const overlapStats = (svg) => {
        const cs = [...svg.matchAll(/<circle cx="([-\d.]+)" cy="([-\d.]+)" r="([-\d.]+)" fill="#fff" stroke="#15181D" stroke-width="([-\d.]+)"/g)]
          .map((m) => ({ x: +m[1], y: +m[2], R: +m[3] + (+m[4]) / 2 }));
        let ov = 0, worst = 0, maxR = 0;
        for (let i = 0; i < cs.length; i++) { maxR = Math.max(maxR, cs[i].R); for (let j = i + 1; j < cs.length; j++) {
          const gap = Math.hypot(cs[i].x - cs[j].x, cs[i].y - cs[j].y) - cs[i].R - cs[j].R;
          if (gap < -0.05) { ov++; worst = Math.min(worst, gap); }
        } }
        return { n: cs.length, ov, worst, maxR };
      };
      try {
        settings.showBadges = true;
        const on = buildSVG().svg, onD = buildSchematicSVG().svg;
        const gOn = countBadges(on), dOn = countBadges(onD);
        const st = overlapStats(on);
        /* 地图上的外沿半径是同一套 stationGlyph 算出来的，导出不许比它大：
           这次修的就是"导出另写了一份尺寸公式、比图上大 1.7 倍"。
           容差 0.2 是给 SVG 数值的 toFixed(1) 留的：r 和描边各能被舍进 0.05，
           外沿 = r + 描边/2，两次舍入最多差 0.15，不是真的画大了。 */
        const mapMaxR = Math.max.apply(null, collectVisible().map((v) => v.size / 2));
        settings.showBadges = false;
        const gOff = countBadges(buildSVG().svg), dOff = countBadges(buildSchematicSVG().svg);
        /* 稠密到"怎样都会贴住"时允许轻微擦边（GS 已封顶缩到 0.34）：要求绝对为 0
           会把这些数据逼成看不见的小点。阈值按牌子尺寸给相对量，而不是写死几个单位
           —— 图幅边距一变，同样的几何就会用不同的缩放画出来，绝对阈值会随机翻脸。
           实测示例图 10 对重叠 → 1 对。 */
        const ok = gOn >= 1 && dOn >= 1 && gOff === 0 && dOff === 0 &&
          !/NaN|Infinity/.test(on) && st.maxR <= mapMaxR + 0.2 &&
          st.ov <= Math.max(1, Math.floor(st.n * 0.06)) && st.worst > -0.55 * st.maxR;
        return { ok, detail: "地理图 牌" + gOn + "/关" + gOff + " · 示意图 牌" + dOn + "/关" + dOff +
          " · 圆点 " + st.n + "：重叠 " + st.ov + " 对（最差 " + st.worst.toFixed(1) + "，外沿 " + st.maxR.toFixed(1) +
          " ≤ 图上 " + mapMaxR.toFixed(1) + "） · 无 NaN" };
      } finally {
        settings.showBadges = savedB === undefined ? true : savedB;
      }
    });

    t("方向键微调：按像素走、整轮连按只记一次撤销、undo 回原位", () => {
      const id = P.lines[0].stations[1];
      const savedSelSt = sel.station, savedTool = tool, savedNudge = [nudgeId, nudgeAt];
      try {
        setTool("select"); sel.station = id; renderMap();
        const px = () => map.latLngToContainerPoint([station(id).lat, station(id).lng]);
        const p0 = px();
        nudgeId = null; nudgeAt = 0;
        const h0 = hist.length;
        nudgeStation(1, 0);
        const p1 = px();
        const onePx = Math.abs(p1.x - (p0.x + 1)) < 1e-6 && Math.abs(p1.y - p0.y) < 1e-6;
        for (let i = 0; i < 5; i++) nudgeStation(1, 0);
        const p6 = px();
        const sixPx = Math.abs(p6.x - (p0.x + 6)) < 1e-6 && Math.abs(p6.y - p0.y) < 1e-6;
        const grew = hist.length - h0;                       // 整轮连按只应 +1
        nudgeStation(0, 10);
        const pd = px();
        const bigStep = Math.abs(pd.x - p6.x) < 1e-6 && Math.abs(pd.y - (p6.y + 10)) < 1e-6;
        sel.station = null;

        const back = Math.abs(pu.x - p0.x) < 1e-6 && Math.abs(pu.y - p0.y) < 1e-6;
        const ok = onePx && sixPx && grew === 1 && bigStep && refused && back && hist.length === h0;
        return { ok, detail: "1px " + onePx + " / 连按 6 次共 " + (p6.x - p0.x).toFixed(1) + "px 且撤销栈 +" + grew +
          " / Shift 10px " + bigStep + " / 未选中时拒绝 " + refused + " / undo 回原位 " + back };

        sel.station = savedSelSt; setTool(savedTool);

    t("导出：墨迹离画布四边一样远（不许贴边），示意图压线的站名不超过 2 张", () => {
      const bad = [];
      const savedP = P, savedSel = sel, savedView = [map.getCenter(), map.getZoom()];
      const M = 108;                       // SCHEME.PAD - 2：四周至少留这么远
      const inkBox = (svg) => {
        const W = +svg.match(/<svg[^>]*width="([\d.]+)"/)[1], H = +svg.match(/<svg[^>]*height="([\d.]+)"/)[1];
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        /* 站点与折线 */
        [...svg.matchAll(/<circle[^>]*cx="([-d.]+)" cy="([-d.]+)"[^>]*r="([-d.]+)"/g)].forEach((m) => {
          const cx = +m[1], cy = +m[2], r = +m[3] + 2;
          x0 = Math.min(x0, cx - r); x1 = Math.max(x1, cx + r); y0 = Math.min(y0, cy - r); y1 = Math.max(y1, cy + r);
        });
        [...svg.matchAll(/<polyline points="([^"]+)"/g)].forEach((m) => {
          m[1].trim().split(/\s+/).forEach((p) => { const q = p.split(","); x0 = Math.min(x0, +q[0]); x1 = Math.max(x1, +q[0]); y0 = Math.min(y0, +q[1]); y1 = Math.max(y1, +q[1]); });
        });
        /* 铭牌：按锚点与实量宽推出矩形 */
        [...svg.matchAll(/<text class="lbl" x="([-\d.]+)" y="([-\d.]+)" text-anchor="(start|end|middle)"[^>]*font-size="(\d+)"[^>]*>([^<]*)<\/text>/g)].forEach((m) => {
          const w = labelSize(m[6], +m[5]).w, h = +m[5] + 9, x = +m[1], y = +m[2];
          const l = m[3] === "middle" ? x - w / 2 : m[3] === "end" ? x - w : x;
          x0 = Math.min(x0, l); x1 = Math.max(x1, l + w); y0 = Math.min(y0, y - h + 3); y1 = Math.max(y1, y + 4);
        });
        return { W: W, H: H, l: Math.round(x0), t: Math.round(y0), r: Math.round(W - x1), b: Math.round(H - y1) };
      };
      const onLine = (svg) => {
        const segs = [];
        [...svg.matchAll(/<polyline points="([^"]+)"/g)].forEach((m) => {
          const pts = m[1].trim().split(/\s+/).map((p) => p.split(",").map(Number));
          for (let i = 0; i < pts.length - 1; i++) segs.push([pts[i], pts[i + 1]]);
        });
        let n = 0;
        [...svg.matchAll(/<text class="lbl" x="([-\d.]+)" y="([-\d.]+)" text-anchor="(start|end|middle)"[^>]*font-size="(\d+)"[^>]*>([^<]*)<\/text>/g)].forEach((m) => {
          const w = labelSize(m[6], +m[5]).w, h = +m[5] + 9, x = +m[1], y = +m[2];
          const l = (m[3] === "middle" ? x - w / 2 : m[3] === "end" ? x - w : x) + 2, tp = y - h + 5;
          for (const s of segs) {
            const ax = Math.min(s[0][0], s[1][0]), bx = Math.max(s[0][0], s[1][0]);
            const ay = Math.min(s[0][1], s[1][1]), by = Math.max(s[0][1], s[1][1]);
            if (bx < l || ax > l + w - 4 || by < tp || ay > tp + h - 4) continue;
            for (let t = 0; t <= 1.0001; t += 0.05) {
              const px = s[0][0] + (s[1][0] - s[0][0]) * t, py = s[0][1] + (s[1][1] - s[0][1]) * t;
              if (px > l && px < l + w - 4 && py > tp && py < tp + h - 4) { n++; return; }
            }
          }
        });
        return n;
      };
      try {
        inSelfTest = true;
        [[24, 3], [60, 5]].forEach(([N, L]) => {
          P = synthProject(N, L); sel = { line: P.lines[0].id, station: null };
          map.setView(P.center, 13, { animate: false }); renderMap();
          const g = inkBox(buildSVG().svg), d = inkBox(buildSchematicSVG().svg);
          [[g, "地理图"], [d, "标准图"]].forEach(([b, nm]) => {
            if (Math.min(b.l, b.t, b.r, b.b) < M) bad.push(nm + " 墨迹离边只有 " + Math.min(b.l, b.t, b.r, b.b) + "px（应 ≥" + M + "）：" + JSON.stringify(b));
          });
          const o = onLine(buildSchematicSVG().svg);
          if (o > 2) bad.push("L" + L + " 标准图有 " + o + " 张站名压在线路上（应 ≤2）");
        });
        /* 负对照：故意把左右余量抽掉一档，贴边判据必须变红 —— 否则这条断言根本没在看东西 */
        const P0 = P;
        try {
          P = synthProject(24, 3); sel = { line: P.lines[0].id, station: null }; map.setView(P.center, 13, { animate: false }); renderMap();
          const keep = SCHEME.PAD;
          try { SCHEME.PAD = 8; const b = inkBox(buildSchematicSVG().svg);
            if (Math.min(b.l, b.t, b.r, b.b) >= M) bad.push("负对照失效：把 PAD 抽到 8 也没测出贴边");
          } finally { SCHEME.PAD = keep; clearLayoutCache(); }
          P = P0;
        } catch (e) { bad.push("负对照抛错：" + e.message); }
      } catch (e) { bad.push("抛错：" + e.message); }
      finally {
        inSelfTest = true; P = savedP; sel = savedSel;
        map.setView(savedView[0], savedView[1], { animate: false }); clearMarkerPools(); renderAll();
        viewLockUntil = performance.now() + 2400; userViewAt = -Infinity;
      }
      return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；") :
        "两种导出的墨迹离四边都 ≥108px（原来右边只剩 10px）；标准图压线站名 ≤2 张；负对照（PAD 抽到 8）能被抓住" };

    t("远程字体表不挡首屏：非阻塞加载 + 到货后切回 all，noscript 有兜底", () => {
      /* 交付形态是"双击即开、可能离线"。一张阻塞渲染的远程样式表，在网络丢包/DNS 被劫持
         的网里会让浏览器在失败之前**一屏都不画**（本机记忆就记着校园网劫持 DNS 这回事）。
         所以远程表必须 media=print 起步、onload 再切成 all；本地 vendor/leaflet.css 反过来
         要保持阻塞 —— 缺它画面就是坏的，宁可等。
         注意初始值没法从运行中的 DOM 读回来：media 是反射属性，字体到货后 onload 已经把它
         改成 "all" 了。所以判据分两层：静态查 onload 属性写没写对，动态查"字体真到了的话
         media 必须已经是 all"（离线时字体到不了，media 留在 print 正是期望行为，不能算红）。 */
      const links = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
      /* "远程"必须按 origin 判，不能按 href 前缀判：用 http(s) 打开时，本地
         vendor/leaflet.css 的 href 会被解析成 http://127.0.0.1:8848/… 绝对地址，
         旧写法 /^https?:/ 把它当成远程表 ⇒ 整条用例假红（file:// 下 href 是 file:///
         所以一直没暴露）。file:// 的 origin 是字符串 "null"，两边相等，照样判本地。 */
      const isRemote = (href, docHref) => {
        try { return new URL(href, docHref).origin !== new URL(docHref).origin; } catch (e) { return false; }
      };
      const remote = links.filter((l) => isRemote(l.href, location.href));
      const bad = [];
      /* 判据自己的真值表 + 负对照：旧的前缀规则必须真的会把本地 leaflet.css 误判成远程，
         否则"换成按 origin 判"没有可证伪的差异，这条改动等于没验。 */
      const TT = [["http://h:8848/vendor/leaflet.css", "http://h:8848/index.html", false],
        ["https://fonts.googleapis.com/css2?family=X", "http://h:8848/index.html", true],
        ["vendor/leaflet.css", "http://h:8848/index.html", false],
        ["file:///D:/x/vendor/leaflet.css", "file:///D:/x/index.html", false],
        ["https://fonts.googleapis.com/css2?family=X", "file:///D:/x/index.html", true],
        ["//fonts.googleapis.com/css2", "http://h:8848/index.html", true]];
      TT.forEach((c) => { if (isRemote(c[0], c[1]) !== c[2]) bad.push("origin 判据错：" + c[0] + " @ " + c[1]); });
      if (!/^https?:/i.test("http://h:8848/vendor/leaflet.css")) bad.push("负对照失效：旧的前缀规则本该把 http 开头的本地表误判为远程");
      let swapped = "未验证（字体没到货）";
      if (!remote.length) bad.push("页面里没有远程样式表，用例没跑起来");
      remote.forEach((l, i) => {
        const oc = l.getAttribute("onload") || "";
        if (!/this\.media\s*=\s*['"]all['"]/.test(oc)) bad.push("第 " + (i + 1) + " 张远程表没有把 media 切成 all 的 onload");
      });
      const ns = document.querySelector("noscript");
      const nsHtml = ns ? ns.innerHTML : "";
      remote.forEach((l, i) => {
        const u = String(l.href).replace(/&amp;/g, "&").slice(0, 36);
        if (nsHtml.indexOf(u) < 0) bad.push("第 " + (i + 1) + " 张远程表在 noscript 里没有兜底");
      });
      const vend = links.filter((l) => /vendor\/leaflet\.css/i.test(l.href));
      if (vend.length !== 1) bad.push("找不到本地 vendor/leaflet.css（离线兜底的另一半）");
      else if (vend[0].getAttribute("media") || vend[0].getAttribute("onload"))
        bad.push("本地 leaflet.css 被改成了非阻塞：缺它画面就是坏的，该等就得等");
      if (remote.length && ev_fontGone()) {
        swapped = remote.map((l) => l.media.toLowerCase() || "-").join(",");
        if (swapped.indexOf("all") < 0) bad.push("字体已经到货，但远程表的 media 还不是 all：" + swapped);
      }
      /* 负对照：把 onload 摘掉再派发 load，media 必须**不**变 —— 证明那个切换真是
         onload 干的，而不是别处顺带改的。摘完原样装回去。 */
      if (remote.length) {
        const l0 = remote[0], saved = l0.getAttribute("onload"), wasAll = l0.media.toLowerCase();
        l0.removeAttribute("onload");
        if (wasAll === "all") l0.media = "print";
        l0.dispatchEvent(new Event("load"));
        if (l0.media.toLowerCase() === "all") bad.push("摘掉 onload 之后派发 load 仍然把 media 改成了 all（切换不是 onload 干的，判据错位）");
        l0.media = wasAll; if (saved) l0.setAttribute("onload", saved);
      }
      function ev_fontGone() {
        try { return !!(document.fonts && document.fonts.check && document.fonts.check('700 15px "Barlow Condensed"')); } catch (e) { return false; }
      }
      return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；") :
        remote.length + " 张远程表都带 media→all 的 onload 且 noscript 有兜底（当前 media：" + swapped + "）；本地 leaflet.css 仍阻塞" };
    });

    t("标准图松弛结果缓存：同图纸二次命中且逐位相同，动一个站或改方案参数必须作废", () => {
      /* 1200 站按一次 G 要跑 561~604ms 松弛，占整张标准图导出的七成；而"图纸没改、
         SCHEME 没改"时松弛结果必然一模一样（松弛器没有随机数，每轮顺序固定）。
         判据全是确定量：
           ① 第一次必是未命中、第二次必是命中，且两次结果逐位相同；
           ② 交出去的是克隆 —— 调用方改了返回值也不许污染缓存（下一次仍要原值）；
           ③ 把站挪开 1e-7 度、把 SCHEME.U 挪开 1e-12，都必须作废（键是全精度内容，
              不许有"两个形状撞同一个键"这种可能）；
           ④ 走完整导出（buildSchematicSVG）时命中缓存，且两次导出的 SVG 字符串逐字节相同。 */
      const savedP = P, savedSel = sel, savedU = SCHEME.U;
      const savedKey = layoutCacheKey, savedVal = layoutCacheVal;
      const savedHits = layoutHits, savedMiss = layoutMisses;
      const bad = [];
      let h0 = 0, m0 = 0, fp1 = "", fp2 = "", svg1 = "", svg2 = "", cloneOk = false, nudgeOk = false, uOk = false, hitOnExport = false;
      const fp = (pos) => { const ks = Object.keys(pos).sort(); const buf = new Float64Array(ks.length * 2); ks.forEach((k, i) => { buf[i * 2] = pos[k].x; buf[i * 2 + 1] = pos[k].y; }); let s = 0; for (let i = 0; i < buf.length; i++) s = (s * 31 + buf[i]) | 0; return ks.length + "/" + s + "/" + buf[0].toFixed(9) + "/" + buf[buf.length - 1].toFixed(9); };
      try {
        inSelfTest = true;
        P = synthProject(200, 4); sel = { line: P.lines[0].id, station: null };
        clearLayoutCache();
        h0 = layoutHits; m0 = layoutMisses;
        const a = layoutSchematic(); fp1 = fp(a);
        if (layoutMisses !== m0 + 1) bad.push("第一次跑没有算未命中（misses " + m0 + " → " + layoutMisses + "）");
        const hitsBefore = layoutHits;
        const b = layoutSchematic(); fp2 = fp(b);
        if (layoutHits !== hitsBefore + 1) bad.push("第二次没走缓存（hits " + hitsBefore + " → " + layoutHits + "）");
        if (fp1 !== fp2) bad.push("同一份图纸两次松弛结果不同，缓存无从谈起");
        if (a === b) bad.push("返回的是同一个对象引用，调用方随手一改就会污染缓存");
        /* ② 污染尝试 */
        const k0 = Object.keys(b)[0]; b[k0] = { x: 12345.678, y: -9876.5 };
        const c = layoutSchematic();
        cloneOk = (fp(c) === fp1);
        if (!cloneOk) bad.push("调用方改了返回值，缓存被污染（第三次结果不等于第一次）");
        /* ③ 作废条件 */
        m0 = layoutMisses;
        const st = station(P.lines[0].stations[3]); st.lat += 1e-7;
        const d = layoutSchematic();
        nudgeOk = (layoutMisses === m0 + 1 && fp(d) !== fp1);
        if (!nudgeOk) bad.push("把站挪开 1e-7 度之后仍然命中旧缓存");
        st.lat -= 1e-7;
        m0 = layoutMisses; SCHEME.U = savedU * (1 + 1e-12);

        SCHEME.U = savedU;
        if (!uOk) bad.push("改了 SCHEME.U 仍然命中旧缓存（键没含方案参数）");
        /* ④ 整条导出路径 */
        const e1 = buildSchematicSVG(); svg1 = e1.svg;
        const hb = layoutHits; const bb = buildSchematicSVG(); svg2 = bb.svg;
        hitOnExport = (layoutHits > hb);
        if (svg1 !== svg2) bad.push("两次标准图导出的 SVG 字符串不一样（长度 " + svg1.length + " vs " + svg2.length + "）");
        if (!hitOnExport) bad.push("第二次导出没有走松弛缓存");
        return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；") :
          "200 站：首跑未命中、二跑命中且 " + fp1 + " 逐位相同；返回值被外部改写也不污染缓存；挪 1e-7 度 / 改 SCHEME.U 都作废；第二次 buildSchematicSVG 命中缓存且 " + svg1.length + " 字节 SVG 逐字节相同" };
      } catch (e) {

    t("松弛器字节指纹冻结（邻接表/arr 改造前后逐位一致）", () => {
      /* 弹簧-斥力松弛是混沌系统：把 Math.hypot 换成 sqrt 这种"看起来等价"的微改，
         1200 个节点也会漂出 252 的位移、成图完全变一张。所以这里不用容差，直接
         把三张图纸的节点坐标按 IEEE-754 原始字节做 FNV-1a 冻结起来。
         将来若真要改松弛算法，必须先改这几个常量，并重新看标准图的像素审计 ——
         "顺手优化一下"是躲不过这条断言的。 */
      const FROZEN = { n50: "95393581", n200: "3aca0b9", n600: "2534f2c0" };
      const fp = (pos) => {
        const ks = Object.keys(pos).sort();
        const buf = new Float64Array(ks.length * 2);
        ks.forEach((k, i) => { buf[i * 2] = pos[k].x; buf[i * 2 + 1] = pos[k].y; });
        const b = new Uint8Array(buf.buffer);
        let h = 0x811c9dc5 >>> 0;
        for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 0x01000193) >>> 0;
        return (h >>> 0).toString(16);
      };
      const savedP2 = P;
      const bad = [];
      const got = {};
      let perturbed = null;
      try {
        inSelfTest = true;
        [50, 200, 600].forEach((N) => { P = synthProject(N, 4); got["n" + N] = fp(layoutSchematic()); });
        Object.keys(FROZEN).forEach((k) => { if (got[k] !== FROZEN[k]) bad.push(k + " 指纹 " + got[k] + " ≠ 冻结的 " + FROZEN[k]); });
        /* 负对照：指纹必须量得出扰动。把静止长度 U 动一丁点（浮点上只有最后一位），
           松弛照样发散成完全不同的图 —— 如果改坏了算法而指纹还"不变"，说明这条
           断言是恒真的空测试。 */
        const savedU = SCHEME.U;
        try { SCHEME.U = savedU * (1 + 1e-12); P = synthProject(50, 4); perturbed = fp(layoutSchematic()); }
        finally { SCHEME.U = savedU; }
        if (perturbed === FROZEN.n50) bad.push("指纹对扰动无反应，这条断言是空的");
        return { ok: !bad.length, detail: bad.length ? bad.slice(0, 2).join("；") :
          "50/200/600 站三份指纹全等；把 U 扰动一个比特立刻改变（" + FROZEN.n50 + "→" + perturbed + "）" };
      } catch (e) {
        return { ok: false, detail: "抛错：" + e.message };
      } finally {
        inSelfTest = true;
        P = savedP2;
      }
    });

    t("撤销栈按字节夹住：步数与字节都夹得住，夹完撤销/重做仍对得上账", () => {

    let res = null, err = null;

    selfTrace = prevTrace;
    badge.remove();

      '<div class="modal-b"><p class="tight" style="color:var(--alert)">自检本身抛错，后面的断言没跑完：</p>' +
