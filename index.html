<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBWAY MAP STUDIO · 地铁线路图绘制器</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 远程字体表原来是**阻塞渲染**的：这份文件的设计场景就是"双击即开、可能离线"，
     而一张拿不到的 CSS 会让浏览器在超时/失败之前不画首屏（校园网那种丢包劫持 DNS 的
     环境最容易踩）。改成 media=print 先不阻塞、到货后 onload 再切成 all；
     noscript 留一份原始阻塞写法兜底。字体晚到本来就被处理过：document.fonts.ready
     会作废宽度缓存并重排一次（见 clearLabelCaches 那处）。vendor/leaflet.css 保持阻塞
     —— 它是本地文件，而且没它就等于画面是坏的，宁可等。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
/* ============================================================
   SUBWAY MAP STUDIO — drafting-instrument chrome
   dark graphite rail + hairline rules + signal amber accents
   ============================================================ */
:root{
  --ink-900:#0B0E13;
  --ink-800:#111620;
  --ink-700:#161D28;
  --ink-600:#1C2431;
  --ink-500:#25303F;
  --rule:#2B3644;
  --rule-soft:#1F2835;
  --text:#E7EDF5;
  --text-mid:#A9B6C6;
  --text-dim:#6D7C8E;
  --signal:#FFB020;
  --signal-deep:#E8951A;
  --live:#3ECF8E;
  --alert:#FF5C5C;
  --info:#5AA9FF;
  --casing:#FFFFFF;

  --font-sign:"Barlow Condensed","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  --rail-h:54px;
  --status-h:26px;
  --pw-left:308px;
  --pw-right:274px;
  --r:3px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink-900);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::selection{background:var(--signal);color:#111}

/* scrollbars */
.scroll{scrollbar-width:thin;scrollbar-color:var(--ink-500) transparent}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--ink-500);border:2px solid var(--ink-800);border-radius:9px}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--rule)}

/* ---------- shell ---------- */
.app{
  height:100vh;display:grid;
  grid-template-rows:var(--rail-h) 1fr var(--status-h);
  grid-template-columns:minmax(0,1fr);
  width:100%;min-width:0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 64px),
    var(--ink-900);
}

/* ---------- top rail ---------- */
.rail{
  position:relative;display:flex;align-items:stretch;gap:0;min-width:0;
  overflow:hidden;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(180deg,#18202C,#121822);
  border-bottom:1px solid var(--rule);
  padding:0 12px 0 0;
  z-index:600;
}
.rail::-webkit-scrollbar{height:0}
.rail::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--signal),transparent 42%);opacity:.55;pointer-events:none;
}
.brand{
  display:flex;align-items:center;gap:11px;padding:0 18px 0 16px;flex:none;white-space:nowrap;
  border-right:1px solid var(--rule-soft);
}
.brand-marks{display:flex;gap:3px;align-items:center}
.brand-marks i{width:7px;height:7px;border-radius:50%;display:block}
.brand-marks i:nth-child(1){background:#E4002B}
.brand-marks i:nth-child(2){background:#0057B7;margin-top:-6px}
.brand-marks i:nth-child(3){background:var(--signal)}
.brand-txt{line-height:1}
.brand-txt b{
  display:block;font-family:var(--font-sign);font-weight:800;font-size:17px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text);
}
.brand-txt span{
  display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.34em;
  color:var(--text-dim);text-transform:uppercase;margin-top:3px;
}

.rail-group{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--rule-soft);flex:none}
.rail-group:last-of-type{border-right:0}
.rail-spacer{flex:1 1 auto;min-width:0}

.tool{
  height:30px;min-width:30px;padding:0 9px;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--ink-700);
  color:var(--text-mid);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;
  transition:background .13s,color .13s,border-color .13s,transform .13s;
  position:relative;
}
.tool:hover{background:var(--ink-600);color:var(--text);border-color:var(--rule)}
.tool:active{transform:translateY(1px)}
.tool.is-on{background:#20293A;color:var(--signal);border-color:#3D4C63}
.tool.is-on::before{
  content:"";position:absolute;left:-1px;top:5px;bottom:5px;width:2px;background:var(--signal);
}
.tool:disabled{opacity:.34;cursor:not-allowed}
.mini:disabled{opacity:.3;cursor:not-allowed}
.mini:disabled:hover{background:transparent;color:inherit}
.tool svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool .kbd{
  font-size:9px;color:var(--text-dim);border:1px solid var(--rule);
  border-radius:2px;padding:0 3px;line-height:14px;
}
.tool--icon{min-width:30px;padding:0;justify-content:center}
.tool--ghost{background:transparent;border-color:transparent}
.tool--ghost:hover{background:var(--ink-600);border-color:var(--rule)}

.select-wrap{position:relative;display:flex;align-items:center}
select.basemap{
  appearance:none;height:30px;padding:0 28px 0 10px;background:var(--ink-700);
  border:1px solid var(--rule);border-radius:var(--r);color:var(--text);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;cursor:pointer;
}
select.basemap:focus{outline:none;border-color:#3D4C63}
.select-wrap::after{
  content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.5px solid var(--text-dim);border-bottom:1.5px solid var(--text-dim);
  transform:translateY(-70%) rotate(45deg);
}
.rail-label{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text-dim);padding-right:2px;
}

/* save pill */
.savepill{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;
  background:var(--ink-700);border:1px solid var(--rule);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-mid);
}
.savepill i{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none;transition:background .2s}
.savepill[data-state="dirty"] i{background:var(--signal)}
.savepill[data-state="dirty"]{color:var(--signal)}
.savepill[data-state="saving"] i{animation:blip .7s infinite}
/* 写入被拒（数据自检没过 / QuotaExceeded）时必须和"未保存"区分开：
   前者是"我试了但没写进去"，用户可以手动导出救数据。 */
.savepill[data-state="error"] i{background:var(--alert);animation:blip .9s infinite}
.savepill[data-state="error"]{color:var(--alert);border-color:rgba(228,0,43,.45)}
.savepill[data-state="error"]{cursor:help}
@keyframes blip{50%{opacity:.15}}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:var(--pw-left) minmax(0,1fr) var(--pw-right);min-height:0;min-width:0}

.panel{
  background:var(--ink-800);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
}
.panel--left{border-right:1px solid var(--rule)}
.panel--right{border-left:1px solid var(--rule);background:var(--ink-800)}
.panel-head{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--rule-soft);background:var(--ink-700);
}
.panel-head h2{
  margin:0;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:var(--text-mid);
}
.panel-head .count{
  margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  border:1px solid var(--rule);border-radius:2px;padding:1px 5px;
}
.panel-body{flex:1;overflow-y:auto;min-height:0}
.panel-foot{flex:none;border-top:1px solid var(--rule-soft);padding:8px 10px;background:var(--ink-700)}

/* project switcher */
.proj{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid var(--rule-soft);align-items:center;flex-wrap:wrap}
.proj select{
  flex:1 1 120px;min-width:0;appearance:none;background:var(--ink-600);border:1px solid var(--rule);border-radius:var(--r);
  height:28px;padding:0 10px;color:var(--text);font-family:var(--font-sign);font-size:14px;letter-spacing:.04em;cursor:pointer;
}
.proj select:focus{outline:none;border-color:#3D4C63}
/* 按钮组当作一个整体参与换行：窄面板里选择器独占一行、四个按钮整齐落在第二行，
   而不是被挤成半宽的方块（四个按钮各缩 12px 就会让整行溢出）。 */
.proj-btns{display:flex;gap:6px;flex:none;margin-left:auto}
.mini{
  height:28px;width:28px;flex:none;border:1px solid var(--rule);border-radius:var(--r);background:var(--ink-600);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-mid);transition:.13s;
}
.mini:hover{background:var(--ink-500);color:var(--signal)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* line rows */
.lines{padding:6px 6px 2px}
.line-row{
  display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r);
  border:1px solid transparent;cursor:pointer;position:relative;transition:background .12s,border-color .12s;
}
.line-row:hover{background:var(--ink-700)}
.line-row.is-sel{background:#1A2330;border-color:#33404F}
.line-row.is-sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:currentColor}
.line-badge{
  min-width:26px;height:18px;padding:0 5px;border-radius:2px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-sign);font-weight:700;font-size:12px;letter-spacing:.04em;color:#fff;
}
/* 窄窗口下这一行的取舍要按"信息优先级"来：线名最重要，元信息（几站几公里）最可以让位。
   原来 `.line-name{flex:1}` 等价于 `1 1 0%` —— 基准宽度 0，只能拿"别人挑剩的"，
   实测 678px 宽的窗口里 196px 侧栏下"1 号线"只分到 33px（要 36px），被省略号截成"1 …"。
   现在名字按内容起步、要缩大家一起缩，而元信息带 flex-shrink:999 顶在前面先缩，
   并且自己也允许省略号，不再像 `flex:none` 那样把整行的宽度锁死。 */
.line-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--text)}
.line-name .ing{
  font-style:normal;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;
  color:var(--signal);border:1px solid rgba(255,176,32,.4);border-radius:2px;padding:0 3px;
}
.line-meta{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);letter-spacing:.04em;flex:0 999 auto;min-width:2.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-row .eye{color:var(--text-dim);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px}
.line-row .eye:hover{background:var(--ink-500);color:var(--text)}
.line-row .eye svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.line-row.is-hidden .line-name,.line-row.is-hidden .line-badge{opacity:.4}
.line-row.is-drag-over{border-color:var(--signal);border-style:dashed}
.line-row.dragging{opacity:.4}

.btn-block{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:32px;
  border:1px dashed var(--rule);border-radius:var(--r);background:transparent;
  color:var(--text-mid);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  transition:.14s;
}
.btn-block:hover{border-color:var(--signal);color:var(--signal);background:#1A2230;border-style:solid}
.btn-block svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

/* station timeline */
.stn-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px 6px;
  border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);background:var(--ink-700);
}
.stn-head h3{margin:0;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
.stn-head b{font-family:var(--font-sign);font-size:14px;letter-spacing:.03em;color:var(--text);font-weight:600}
.stn-head .acts{margin-left:auto;display:flex;gap:5px}

.stns{padding:5px 0 9px}
.stn{
  display:flex;align-items:center;gap:6px;padding:3px 8px 3px 0;position:relative;
  transition:background .12s;cursor:pointer;
}
.stn:hover{background:var(--ink-700)}
.stn.is-sel{background:#1B2532;box-shadow:inset 2px 0 0 var(--signal)}
.stn[draggable="true"]{cursor:grab;user-select:none}
.stn.dragging{opacity:.4}
.stn.drop-before{box-shadow:inset 0 2px 0 var(--signal)}
.stn.drop-after{box-shadow:inset 0 -2px 0 var(--signal)}
.stn-rail{width:28px;flex:none;position:relative;height:34px}
.stn-rail::before{
  content:"";position:absolute;left:12px;top:0;bottom:0;width:4px;background:var(--lc,#666);opacity:.85;
}
.stn:first-child .stn-rail::before{top:50%}
.stn:last-child .stn-rail::before{bottom:50%}
.stn-rail i{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--lc,#666);
}
.stn.is-x .stn-rail i{width:15px;height:15px;left:6.5px;background:#fff;border-width:3px}
.stn-name{
  flex:1;min-width:0;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.stn-name input{
  width:100%;background:var(--ink-600);border:1px solid var(--signal);border-radius:2px;padding:2px 5px;font-size:12.5px;
}
.stn-name input:focus{outline:none}
.stn-idx{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);width:15px;text-align:right;flex:none}
.stn-acts{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  display:flex;gap:1px;opacity:0;pointer-events:none;transition:opacity .12s;
  background:rgba(28,36,49,.96);border:1px solid var(--rule);border-radius:2px;padding:1px 2px;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.stn:hover .stn-acts,.stn.is-sel .stn-acts{opacity:1;pointer-events:auto}
.stn-acts button{
  width:19px;height:19px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);
}
.stn-acts button:hover{background:var(--ink-500);color:var(--signal)}
.stn-acts button svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.empty{padding:26px 20px;text-align:center;color:var(--text-dim);font-size:12px;line-height:1.9}
.empty b{display:block;font-family:var(--font-sign);font-size:15px;letter-spacing:.08em;color:var(--text-mid);margin-bottom:5px;text-transform:uppercase}
.empty kbd{
  font-family:var(--font-mono);font-size:10px;background:var(--ink-600);border:1px solid var(--rule);
  border-radius:2px;padding:1px 4px;color:var(--text-mid);
}

/* ---------- map ---------- */
.mapwrap{position:relative;min-width:0;background:#0A0D12}
#map{position:absolute;inset:0;background:#0A0D12}
.leaflet-container{font-family:var(--font-body)!important}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{
  background:rgba(11,14,19,.72)!important;color:var(--text-dim)!important;
  font-family:var(--font-mono)!important;font-size:9px!important;padding:2px 7px!important;
  border-radius:2px 0 0 0!important;
}
.leaflet-control-attribution a{color:var(--text-mid)!important}

.map-hud{position:absolute;inset:0;pointer-events:none;z-index:400}
#guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#guides .guide{stroke:#FFB020;stroke-width:1;stroke-dasharray:5 4;opacity:.95}
#guides .guide-dot{fill:#FFB020;stroke:#0B0E13;stroke-width:1}
.hud{position:absolute;pointer-events:auto}
.hud--tr{top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud--tl{top:10px;left:10px}
.hud--br{right:10px;bottom:26px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.hud-box{
  background:rgba(14,18,25,.88);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);
  padding:6px 8px;backdrop-filter:blur(7px);
}
.mapbtns{display:flex;flex-direction:column}
.mapbtns button{
  height:27px;width:27px;display:flex;align-items:center;justify-content:center;color:var(--text-mid);
  border-bottom:1px solid var(--rule-soft);
}
.mapbtns button:last-child{border-bottom:0}
.mapbtns button:hover{background:var(--ink-600);color:var(--signal)}
.mapbtns button.on{color:var(--signal);background:rgba(255,176,32,.13)}
.mapbtns button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.modechip{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(14,18,25,.9);border:1px solid #3D4C63;border-radius:14px;padding:5px 12px 5px 9px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--signal);text-transform:uppercase;
  backdrop-filter:blur(7px);
}
.modechip i{width:5px;height:5px;border-radius:50%;background:var(--signal);animation:blip 1.1s infinite}

.legend{display:flex;flex-direction:column;gap:4px;max-width:200px}
.legend-h{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:1px}
.legend-r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-mid)}
.legend-r s{width:16px;height:4px;border-radius:2px;flex:none;text-decoration:none}

/* 站型按北京地铁样式：白底 + 黑环，环色<b>不</b>跟随线路色
   （线路色只出现在色带、图例和站名铭牌的左边框上）。
   参数取自 rmp 的 bjsubway-basic / bjsubway-int 实测值：
     basic  circle r=4 stroke=black strokeWidth=0.5 fill=white   —— 虚线环 = 暂缓开通
     int    circle r=6 stroke=black strokeWidth=1   fill=white + 黑色换乘箭头
     出站换乘时箭头转灰 #898989
   rmp 里 basic:int 直径比 = 8:12，对线宽 5 的比是 1.6 / 2.4，这里按线宽等比放大。 */
.pin-wrap{background:none!important;border:0!important}
.pin{
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;
  border:1.5px solid #15181D;
  box-shadow:0 0 0 1px rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.45);
  font-style:normal;font-weight:700;color:#15181D;line-height:1;
  transition:box-shadow .12s,transform .12s;
}
.pin--x{border-width:2.5px;font-family:var(--font-mono)}
.pin--out{color:#898989}
.pin--t::after{content:"";width:34%;height:34%;border-radius:50%;background:#15181D}
.pin--staged{border-style:dashed}
.pin--free{border-style:dashed;border-color:#718096;background:#E7EDF5}
#map.is-link-connect .pin-wrap{cursor:crosshair;touch-action:none}
.pin--sel{transform:scale(1.12);box-shadow:0 0 0 3px var(--signal),0 0 0 6px rgba(255,176,32,.28),0 1px 4px rgba(0,0,0,.5)}
.pin--drag{cursor:grabbing;transform:scale(1.2)}
.leaflet-marker-icon{transition:none}
.leaflet-marker-draggable{cursor:grab}
.leaflet-marker-draggable:active{cursor:grabbing}

/* station labels on map — 深色铭牌，在浅色路网底图上也能一眼认出是"我画的"标注 */
.lbl-wrap{background:none!important;border:0!important;width:0!important;height:0!important;overflow:visible!important;pointer-events:none}
.stn-label{
  position:absolute;left:0;top:0;
  border-radius:3px;padding:2px 7px 2px 6px;white-space:nowrap;pointer-events:none;
  font-family:var(--font-sign);font-weight:700;font-size:13.5px;letter-spacing:.02em;line-height:15px;
  background:rgba(14,19,25,.93);
  color:#F4F8FD;
  border:1px solid rgba(255,255,255,.22);
  border-left:3px solid var(--c,#666);
  box-shadow:0 2px 7px rgba(0,0,0,.5);
  text-shadow:none;
}
.stn-label.is-x{font-size:14.5px;padding:3px 8px 3px 7px}
/* 手动拖定的铭牌：位置由 labelOff 决定，可再拖、可双击交还自动避让 */
.stn-label.s-man{cursor:move;outline:1px dashed rgba(255,176,32,.55);outline-offset:2px}
.lbl--drag .stn-label{cursor:grabbing;background:rgba(255,176,32,.95);color:#10141A;border-color:#0C1017}
/* 铭牌默认不吃点击（否则加站模式下会挡住落点）；只有 Leaflet 判为 interactive 时才可命中。
   可拖性只在"选择"工具下开启，且由 place() 在状态变化时重建 marker。 */
.lbl-wrap.leaflet-interactive{pointer-events:auto}
.stn-label--inv{
  background:rgba(248,249,251,.95);color:#0C1017;
  border-color:rgba(12,16,23,.3);box-shadow:0 2px 7px rgba(0,0,0,.35);
}
/* 8 个候选方位：铭牌相对站点圆点的落位。
   位移量必须和 solveSides 里的 labelRect 完全一致（gap=10px），
   之前斜向写的是 5px，导致求解器算的矩形比实际位置高/低 5px，
   斜向标签被判成"干净"却实际压线。 */
.s-r {transform:translate(10px,-50%)}
.s-l {transform:translate(calc(-100% - 10px),-50%)}
.s-t {transform:translate(-50%,calc(-100% - 10px))}
.s-b {transform:translate(-50%,10px)}
.s-tr{transform:translate(10px,calc(-100% - 10px))}
.s-tl{transform:translate(calc(-100% - 10px),calc(-100% - 10px))}
.s-br{transform:translate(10px,10px)}
.s-bl{transform:translate(calc(-100% - 10px),10px)}
.leaflet-interactive{outline:none}
/* 曲线调形把手 */
.handle-wrap{background:none!important;border:0!important}
.handle{
  display:flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:3px;
  font-family:var(--font-mono);font-size:11px;font-weight:600;line-height:1;
  background:var(--signal);color:#10141A;border:1px solid #0C1017;
  box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:grab;transition:transform .1s;
}
.handle:hover{transform:scale(1.18)}
.handle--new{
  background:rgba(255,255,255,.55);color:rgba(12,16,23,.55);
  border:1px dashed rgba(255,176,32,.9);font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.handle--new:hover{color:#10141A;background:var(--signal)}
/* 线路编号牌：牌色跟随线路，外圈一道白环 —— 线路本身就带白壳（width+3.5），
   白环让它看起来像色带上加宽的一块牌，而不是浮在上面的贴纸。 */
.badge-wrap{background:none!important;border:0!important}
.badge-wrap.leaflet-interactive{cursor:pointer}
.ln-badge{
  position:absolute;left:0;top:0;
  display:inline-flex;align-items:center;justify-content:center;
  height:17px;min-width:17px;padding:0 4px;border-radius:4px;
  font-family:var(--font-sign);font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.02em;
  white-space:nowrap;color:#fff;
  box-shadow:0 0 0 1.6px #FFF,0 1px 5px rgba(0,0,0,.5);
}
.ln-badge.is-dark{color:#10141A}
/* 连线模式的临时卡片：挂在 body 上、不进任何 Leaflet pane（pane 层序不能动）。
   宽度受视口约束 + 链文省略号，免得窄屏把状态条那类无声截断再犯一遍。 */
#linkCard{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:900;display:none}
#linkCard:not(:empty){display:block}
#linkCard .lk-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:min(680px,calc(100vw - 20px));
  background:rgba(16,20,26,.95);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;
  box-shadow:0 8px 26px rgba(0,0,0,.5);color:#E7EDF5;font-size:12px}
#linkCard .lk-chain{flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#C8D6E5;font-size:11.5px}
#linkCard .lk-btns{display:flex;gap:6px;flex:0 0 auto}
#linkCard .tool{padding:4px 9px;font-size:11.5px}
#linkCard .tool[disabled]{opacity:.45}
#linkCard .lk-steps{display:flex;gap:6px;flex:0 0 100%}
#linkCard .lk-reason{flex:1 1 100%;color:#FFCF82;line-height:1.5}
/* 模拟导航卡片约束在地图区域内；图层和播放状态均独立于图纸与撤销历史。 */
#navCard[hidden]{display:none}
#navCard{position:absolute;left:12px;bottom:12px;z-index:800;width:340px;max-width:calc(100% - 24px);max-height:calc(100% - 66px);overflow:auto;
  padding:12px;background:rgba(16,20,26,.97);border:1px solid #394351;border-radius:9px;box-shadow:0 8px 28px #0007;color:var(--text);font-size:12px}
.nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:14px}
.nav-head .x{font-size:14px;padding:4px;color:var(--text-mid)}
.nav-fields{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;gap:7px;align-items:center}
.nav-fields label{color:var(--text-mid);font-size:11px}
.nav-fields label[for=navTo]{grid-column:1}
.nav-fields #navSwap{grid-column:3;grid-row:1 / span 2;height:100%;padding:0;min-width:0}
.nav-picker{position:relative;min-width:0}
.nav-picker input{width:100%;min-width:0;height:29px;padding:0 7px;border:1px solid var(--rule);border-radius:3px;background:var(--ink-600);color:var(--text);font-size:12px}
.nav-picker input:focus{outline:none;border-color:var(--signal)}
.nav-results[hidden]{display:none}
.nav-results{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:3;max-height:166px;overflow:auto;background:#1C242F;border:1px solid #4A596E;border-radius:4px;box-shadow:0 6px 18px #0007}
.nav-result{display:block;width:100%;padding:7px 8px;text-align:left;color:var(--text);cursor:pointer;background:transparent}
.nav-result+.nav-result{border-top:1px solid var(--rule-soft)}
.nav-result b,.nav-result small{display:block;overflow-wrap:anywhere}
.nav-result b{font-size:12px;font-weight:500}.nav-result small{font-size:10px;color:var(--text-mid);margin-top:3px}
.nav-result:hover,.nav-result[aria-selected=true]{background:#334157}
.nav-search-note{font-size:11px;padding:9px;color:var(--text-mid);line-height:1.5}
#navCard select{min-width:0;max-width:100%;height:29px;border:1px solid var(--rule);border-radius:3px;background:var(--ink-600);color:var(--text);font-size:12px;padding:0 5px}
.nav-options{display:flex;gap:12px;margin:9px 0;color:var(--text-mid);flex-wrap:wrap}
.nav-options label{display:flex;gap:5px;align-items:center}
.nav-summary{color:#FFCD84;line-height:1.5}
.nav-itinerary{max-height:94px;overflow:auto;margin:7px 0}
.nav-trip{display:flex;gap:7px;line-height:1.6;color:var(--text-mid);padding:3px 0}
.nav-trip i{width:4px;min-height:31px;flex:none;border-radius:3px}
.nav-trip span{min-width:0;overflow-wrap:anywhere}.nav-trip b{color:var(--text);font-weight:600}
.nav-live{min-height:20px;line-height:1.6;color:var(--text);overflow-wrap:anywhere}
.nav-live[data-state=finished]{color:var(--live)}
.nav-announcement{margin-top:10px;padding:9px 11px;border-left:2px solid var(--signal);background:var(--ink-900);font-size:12px;line-height:1.6;overflow-wrap:anywhere;max-height:145px;overflow:auto}
#navAnnouncementEn{margin-top:5px;color:var(--text-mid);font-size:11px}
#navProgress{width:100%;height:5px;display:block;margin:7px 0 10px;accent-color:var(--signal)}
.nav-controls{display:flex;gap:6px;flex-wrap:wrap}.nav-controls .btn{min-width:0;padding:6px 10px;height:30px;font-size:12px}
.nav-controls button:disabled{opacity:.4;cursor:default}
.nav-toggles{display:flex;gap:13px;margin:10px 0 7px;flex-wrap:wrap;color:var(--text-mid)}
.nav-toggles label{display:flex;gap:4px;align-items:center}.nav-toggles input{accent-color:var(--signal)}
.nav-note{display:block;font-size:10px;line-height:1.5;color:var(--text-dim)}
.nav-train-wrap{background:none!important;border:0!important}
.nav-train{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#FFCA67;color:#15202C;
  border:2px solid #FFF;border-radius:7px;box-shadow:0 2px 8px #000a;font-size:16px;line-height:1}
/* 注意：不要给 .leaflet-pane 统一设 z-index:auto —— Leaflet 靠
   tile 200 / overlay 400 / shadow 500 / marker 600 / tooltip 650 排层序，
   抹平后站名标签会被瓦片盖住（实测标签完全看不见）。 */

/* ---------- right inspector ---------- */
.insp{padding:0}
.insp-sec{border-bottom:1px solid var(--rule-soft);padding:11px 12px}
.insp-sec h4{
  margin:0 0 9px;font-family:var(--font-mono);font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.insp-sec h4 em{flex:1;height:1px;background:var(--rule-soft)}
.field{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.field:last-child{margin-bottom:0}
.field label{
  width:52px;flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-dim);
}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  flex:1;min-width:0;height:27px;background:var(--ink-600);border:1px solid var(--rule);border-radius:2px;
  padding:0 8px;font-size:12.5px;color:var(--text);
}
.field textarea{height:auto;padding:6px 8px;font-size:12px;resize:vertical;min-height:48px;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--signal);background:#20283600}
.field input:focus,.field textarea:focus{border-color:#4A5C74;background:var(--ink-500)}
.field input[type=color]{
  width:30px;height:27px;padding:0;background:var(--ink-600);border:1px solid var(--rule);border-radius:2px;cursor:pointer;
}
.field input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
.field input[type=color]::-webkit-color-swatch{border:0;border-radius:1px}
.field input[type=range]{flex:1;accent-color:var(--signal);height:20px}
.field .num{font-family:var(--font-mono);font-size:10px;color:var(--text-mid);width:34px;text-align:right}

.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:1}
.seg button{
  flex:1;height:27px;background:var(--ink-700);color:var(--text-dim);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;transition:.13s;
}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.is-on{background:#2C3A4E;color:var(--signal)}
.seg button:hover{color:var(--text)}

.chk{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:12px;color:var(--text-mid)}
.chk input{appearance:none;width:14px;height:14px;border:1px solid var(--rule);border-radius:2px;background:var(--ink-600);flex:none;position:relative;cursor:pointer}
.chk input:checked{background:var(--c);border-color:var(--c)}
.chk input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #0B0E13;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.chk:hover{color:var(--text)}
.chk .swatch{width:9px;height:9px;border-radius:2px;flex:none}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.stat{background:var(--ink-700);padding:8px 9px}
.stat b{
  display:block;font-family:var(--font-sign);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--text);line-height:1.1;
}
.stat b small{font-size:11px;color:var(--text-dim);font-weight:600;margin-left:2px}
.stat span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}

.danger{color:var(--alert)!important;border-color:rgba(255,92,92,.35)!important}
.danger:hover{background:rgba(255,92,92,.13)!important;color:var(--alert)!important}
.row-btns{display:flex;gap:6px;margin-top:9px}
.row-btns .tool{flex:1;justify-content:center;height:28px}

/* ---------- status bar ---------- */
.status{
  display:flex;align-items:center;gap:0;background:var(--ink-700);border-top:1px solid var(--rule);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--text-dim);
  padding:0 10px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;
}
.status::-webkit-scrollbar{display:none}
.status .cell{padding:0 11px;border-right:1px solid var(--rule-soft);height:100%;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.status .cell:first-child{padding-left:2px}
.status b{color:var(--text-mid);font-weight:500}
.status .flex{flex:1 1 0;border:0;color:var(--text-dim)}
.status .hint{color:var(--text-dim);display:block;align-self:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .hint kbd{color:var(--signal)}
.status .dot{width:5px;height:5px;border-radius:50%;background:var(--info)}
/* 窄屏（手机/半宽窗口）下状态条本来就放不下：先藏掉次要的经纬度与缩放，
   再藏里程与标签计数，最后剩下的靠省略号。以前是整条无声裁切，第 63 条抓到过。 */
@media (max-width:900px){.status .cell.geo{display:none}}
@media (max-width:640px){.status .cell.km,#sLabel{display:none}}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(6,9,13,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:2000;padding:24px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}}
.modal{
  width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--ink-800);
  border:1px solid var(--rule);border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.6);
  animation:pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}}
/* 自检进行中角标：断言是同步跑的（全套约 7 秒），必须在此之前给出反馈，否则按
   Shift+T 就是毫无反应的假死。刻意不复用 .scrim/.modal —— bindKeys 一见文档里有
   .scrim 就吞掉所有按键（只留 Esc），自检里有一整条"帮助键位都要按得动"的断言，
   先挂面板会让它假红（实测：报"键 V/L/N 没产生帮助里说的效果"）。
   角标不参与键路，也不会被别的断言误认成面板。 */
.st-busy{
  position:fixed;left:50%;transform:translateX(-50%);bottom:54px;z-index:2100;
  padding:8px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--ink-800);
  color:var(--text-mid);font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;
  box-shadow:0 12px 30px rgba(0,0,0,.5);animation:fade .16s ease;
}
.modal-h{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule-soft);
  background:linear-gradient(180deg,#1A222E,#141A24);
  /* 弹窗整体是滚动容器（max-height:86vh），帮助有 19 行键位，小窗口里往下滚
     就该看不见右上角的 ✕ 了。标题条贴顶，滚动时关闭按钮始终在手边。 */
  position:sticky;top:0;z-index:2;
}
.modal-h b{font-family:var(--font-sign);font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.modal-h .x{margin-left:auto;width:24px;height:24px;color:var(--text-dim);border-radius:2px}
.modal-h .x:hover{background:var(--ink-500);color:var(--alert)}
.modal-b{padding:16px}
.modal-b p{margin:0 0 12px;line-height:1.8;color:var(--text-mid);font-size:12.5px}
.modal-b p.tight{margin-bottom:6px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule-soft);background:var(--ink-700)}
.btn{
  height:31px;padding:0 16px;border-radius:2px;border:1px solid var(--rule);background:var(--ink-600);
  color:var(--text-mid);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:.13s;
}
.btn:hover{background:var(--ink-500);color:var(--text)}
.btn--go{background:var(--signal);border-color:var(--signal);color:#10141A;font-weight:600}
.btn--go:hover{background:var(--signal-deep);border-color:var(--signal-deep);color:#10141A}
.inp-wide{
  width:100%;height:32px;background:var(--ink-600);border:1px solid var(--rule);border-radius:2px;padding:0 10px;font-size:13px;
}
.inp-wide:focus{outline:none;border-color:var(--signal);background:var(--ink-500)}
.help-row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule-soft);font-size:12px;color:var(--text-mid);align-items:center}
.help-row:last-child{border:0}
.help-row kbd{
  font-family:var(--font-mono);font-size:10px;background:var(--ink-600);border:1px solid var(--rule);
  border-radius:2px;padding:2px 6px;color:var(--signal);min-width:26px;text-align:center;
}
.help-row span{flex:1}
.bm-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--rule-soft)}
.diagbox{
  background:#F6F7F9;border:1px solid var(--rule);border-radius:3px;padding:10px;
  max-height:58vh;overflow:auto;
}
.diagbox svg{display:block;width:100%;height:auto}
.modal--wide{width:min(960px,100%)}
.bm-row:last-child{border-bottom:0}
.bm-row .nm{flex:1;font-size:12.5px}
.bm-row .nm em{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);font-style:normal;margin-top:2px}
.tag{
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;padding:2px 5px;border-radius:2px;
  background:var(--ink-500);color:var(--text-dim);border:1px solid var(--rule);
}
.tag--ok{color:var(--live);border-color:rgba(62,207,142,.4)}
.tag--key{color:var(--signal);border-color:rgba(255,176,32,.4)}

/* 本地存储一览（设置面板底部）：配额出事时这里是最快看出"哪张图吃掉了空间"的地方 */
.sto{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
.sto-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sto-h b{font-family:var(--font-sign);font-size:14px;letter-spacing:.06em}
.sto-h .tot{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.sto-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--rule-soft);font-size:12px}
.sto-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sto-row .kb{font-family:var(--font-mono);font-size:10px;color:var(--text-mid);flex:none}
.sto-row .prev{color:var(--text-dim);min-width:96px;text-align:right}
.sto-note{font-size:11px;color:var(--text-dim);line-height:1.75;margin-top:8px}

/* toast */
.toasts{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:rgba(18,24,33,.96);border:1px solid var(--rule);border-left:2px solid var(--signal);
  padding:7px 14px;border-radius:2px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text);
  animation:rise .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast--bad{border-left-color:var(--alert)}
.toast--good{border-left-color:var(--live)}
@keyframes rise{from{transform:translateY(10px);opacity:0}}

/* dropzone overlay */
.dropping::after{
  content:"拖入 .json 图纸文件载入";position:fixed;inset:0;z-index:2500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(11,14,19,.82);border:2px dashed var(--signal);
  font-family:var(--font-sign);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);
}

<script>
"use strict";
/* ============================================================
   1. 工具函数
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const R_EARTH = 6371.0088;
function haversine(a, b, c, d) {
  const t = Math.PI / 180;
  const dx = (c - a) * t, dy = (d - b) * t;
  const s = Math.sin(dy / 2) ** 2 + Math.cos(b * t) * Math.cos(d * t) * Math.sin(dx / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(s));
}
function fmt(n, digits) { return Number(n || 0).toFixed(digits == null ? 1 : digits); }
function download(name, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1200);
}
function toast(msg, kind) {
  if (inSelfTest) { console.info("[selftest toast suppressed] " + msg); return; }
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s,transform .3s"; el.style.opacity = "0"; el.style.transform = "translateY(6px)"; setTimeout(() => el.remove(), 320); }, 2300);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ============================================================
   2. 本地存储
   ============================================================ */
/* 仅静态发布产物加入此标记；本地文件与 Node 服务仍保留原来的存档行为。 */
const STATIC_HOST = !!document.querySelector('meta[name="subwaystudio-hosting"][content="static"]');
const NS = "subwaystudio.v1";
const K_REG = NS + ".registry";
const K_SET = NS + ".settings";
const K_PROJ = (id) => NS + ".project." + id;
/* 每个图纸留一份"上一个已知良好"的副本。persistProject 只在数据自检通过时
   才写主键，所以轮转出去的那份必然是好的，坏数据进来时有东西可以回滚。 */
const K_PREV = (id) => NS + ".prev." + id;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v, onError) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { if (onError) onError(e); else toast("本地存储失败：" + e.name, "bad"); return false; }
  },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
/* localStorage 不是"永远能碰"的：无痕模式、站点数据被拦、某些浏览器在 file:// 下直接禁用
   存储 —— 那时候连"读一下"都会抛 SecurityError。store.* 一直包着，但下面这几处是裸调用，
   其中 pruneGhostRegistry 与 fillProjSelect 都在开机路径上：一旦抛，用户看到的就是一屏空白，
   而不是"这台浏览器不让我存东西"这句话。统一走这三个安全版；拿不到就当没有。 */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsLen() { try { return localStorage.length; } catch (e) { return 0; } }
function lsKey(i) { try { return localStorage.key(i); } catch (e) { return null; } }

const PALETTE = [
  { c: "#E4002B", n: "红" }, { c: "#0057B7", n: "蓝" }, { c: "#FFB81C", n: "黄" },
  { c: "#009A44", n: "绿" }, { c: "#7B3F98", n: "紫" }, { c: "#00A9A5", n: "青" },
  { c: "#F26522", n: "橙" }, { c: "#5C2E7F", n: "深紫" }, { c: "#8CCE3A", n: "黄绿" },
  { c: "#C24336", n: "砖红" }, { c: "#1E9BE0", n: "浅蓝" }, { c: "#4A4E54", n: "灰" },
  { c: "#E8639F", n: "粉" }, { c: "#00693E", n: "深绿" }
];

/* 牌底上该用白字还是黑字：按 WCAG 相对亮度判，阈值取 0.43 附近
   （实测这条线把黄/青/浅蓝推到黑字，红/蓝/紫/绿留在白字，和地铁图的惯例一致）。 */
function textOn(hex) {
  const m = /^#?([0-9a-fA-F]{6})$/.exec(String(hex || "").trim());
  if (!m) return "#FFFFFF";
  const n = parseInt(m[1], 16);
  const ch = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * ch((n >> 16) & 255) + 0.7152 * ch((n >> 8) & 255) + 0.0722 * ch(n & 255);
  return L > 0.43 ? "#10141A" : "#FFFFFF";
}
const isDarkTextOn = (hex) => textOn(hex) === "#10141A";

/* ============================================================
   3. 全局状态
   ============================================================ */
let settings = Object.assign({
  basemap: "amap", keys: { tianditu: "" }, customUrl: "", showLabels: true,
  archKey: "", archAuto: false, archAutoName: "",
  darkLabels: false, mergeNear: true, mergePx: 24,
  stack: true, snap: true, predict: true, cullLabels: true, showBadges: true, pngScale: 2, datumFit: true
}, store.get(K_SET, {}));
if (!settings.keys) settings.keys = { tianditu: "" };

let reg = store.get(K_REG, { projects: [], active: null });
let P = null;                                  // 当前图纸
let sel = { line: null, station: null };       // 选中
let tool = "select";
let pendingInsert = null;                      // { lineId, index }
let hist = [], future = [];
let map, layerCase, layerLine, layerStn, layerLabel, layerGhost, layerHandle, layerBadge, tileLayer = null, annoLayer = null;
let labelObstacles = [];   // 本次渲染里所有线路折线（屏幕像素），供标签避让打分用

const line = (id) => P.lines.find((l) => l.id === id);
const station = (id) => P.stations[id];
const activeLine = () => line(sel.line);
function nextColor() {
  const used = P.lines.map((l) => l.color);
  const free = PALETTE.find((p) => !used.includes(p.c));
  return (free || PALETTE[P.lines.length % PALETTE.length]).c;
}

/* ============================================================
   4. 底图
   ============================================================ */
/* 天地图瓦片只走官方 MapService 页给出的 WMTS REST 形式，参数名逐字照抄。
   原先写的是 DataServer?T=vec_w&…&z={z} —— 层级参数到底叫 l 还是 z 我拿不到官方依据，
   换成 WMTS 之后没有歧义（层级写在 TILEMATRIX={z} 里）。
   图层配对是硬事实：vec_w↔cva_w（矢量+注记）、img_w↔cia_w（影像+注记）、ter_w↔cta_w
   （地形+地形注记）。上一版把影像注记写成 "cba_w" —— 官方表里没有这个代码，
   症状恰好是"卫星图出得来、地名注记永远空白"，而且浏览器只会静默 404，很难归因。 */
const TDT_SUB = ["0", "1", "2", "3", "4", "5", "6", "7"];
const TDT_MAX = 18;
const TDT_TAIL = "wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER={L}&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk={tk}";
function tdtUrl(code) { return "https://t{s}.tianditu.gov.cn/" + code + "_w/" + TDT_TAIL.replace("{L}", code); }
/* WGS-84 → GCJ-02（国测局加密）。这套常数与公式是公开的，写在这儿有两个用途：
   ① 立刻能告诉用户"你现在这张底图会让站字偏多少米"；② 以后做底图自适应套合时，
   正反变换必须只有这一个实现处，不能到用时再抄第二份。 */
const GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;
const gcjOut = (lat, lng) => lng > 72.004 && lng < 137.8347 && lat > 0.8293 && lat < 55.8271;
function gcjDelta(lat, lng) {
  const tl = (x, y) => { let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x)); r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3; r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3; r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3; return r; };
  const to = (x, y) => { let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x)); r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3; r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3; r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3; return r; };
  if (!gcjOut(lat, lng)) return [0, 0];
  const dLat = tl(lng - 105, lat - 35), dLng = to(lng - 105, lat - 35);
  const rl = lat / 180 * Math.PI;
  let mg = Math.sin(rl); mg = 1 - GCJ_EE * mg * mg;
  const s = Math.sqrt(mg);

             `rx1 <= b.x`（贴边即跳过），跟判据自己不一致 —— 500 站的真实拖拽场景里

          }

       迟滞的 -1.5 会把 60 拉成 58.5，导致压线的方位被误判为"干净"而不隐藏 */

/* SVG 侧：把同一个方位结论翻译成 text 的 x / y / text-anchor */
function svgLabelXY(x, y, side, g) {

/* ============================================================
   8.7 下一站位置预测（借 rmp predict-next-node：cur + (cur − mean(邻居))）
   ============================================================ */
function predictNext(l) {
  if (!l || l.stations.length < 2) return null;
  const ss = l.stations.map(station).filter(Boolean);
  if (ss.length < 2) return null;
  const cur = map.latLngToContainerPoint([ss[ss.length - 1].lat, ss[ss.length - 1].lng]);
  const prev = ss[ss.length - 2];
  const nb = map.latLngToContainerPoint([prev.lat, prev.lng]);
  const nx = cur.x + (cur.x - nb.x), ny = cur.y + (cur.y - nb.y);

// BEGIN NAV PLAN
/* Route over station occurrences, not station names. A repeated station on one

function planRide(project, fromId, toId, preference = "transfers") {

  const owns = (id) => Object.prototype.hasOwnProperty.call(stationMap, id) && !!stationMap[id];
  if (!owns(fromId)) return result(false, "出发站不存在，请重新选择", "missing-from");
  if (!owns(toId)) return result(false, "到达站不存在，请重新选择", "missing-to");
  if (fromId === toId) {

  if (!destinations.length) return result(false, "到达站尚未接入运营线路，请先连接车站", "unserved-to");

      '<span class="line-meta">' + l.stations.length + "站 " + (km > 0 ? fmt(km) + "km" : "—") + "</span>" +

        : '<svg viewBox="0 0 24 24"><path d="M4 4l16 16M9.5 9.6A3 3 0 0012 15a3 3 0 002.4-1.2M6.7 6.9C4.4 8.3 2 12 2 12s4 7 10 7c2 0 3.7-.7 5.2-1.6"/></svg>') +
      "</button></div>";
  }).join("");
}

/* 站序列表的"结构钥匙"：一行 HTML 只依赖 线路 id/配色 + 站序 + 每站站名 + 每站所属线路数
   （换乘徽标）。选中态刻意不在里面 —— 它走就地补丁，见 renderStnList。
   返回 null 表示"有站查不到"（数据正被删），必须走整表重建，与原 map 里 return "" 的
   形状保持一致。 */
function stnStructKey(l) {
  let s = l.id + "\u0001" + l.color + "\u0001" + l.stations.length + "\u0001";
  for (let i = 0; i < l.stations.length; i++) {
    const id = l.stations[i], st = station(id);
    if (!st) return null;
    s += id + "\u0002" + st.name + "\u0002" + st.lines.length + "\u0003";
  }
  return s;
}
/* 就地挪选中态：一次遍历 + 只在真的要改时写 class。300 行的列表换一次选中，
   重建 innerHTML 要一百多毫秒（每行四个内联 SVG），补丁是零点几毫秒，
   顺带保住列表的滚动位置 —— 重建会把 scroll 弹回顶部，点第 200 行就被踢回第 1 行。 */
function patchStnSel(box) {
  const kids = box.children;
  for (let i = 0; i < kids.length; i++) {
    const el = kids[i];
    const on = el.getAttribute("data-id") === sel.station;
    if (el.classList.contains("is-sel") !== on) el.classList.toggle("is-sel", on);
  }
}
let stnListKey = null, stnListPatches = 0, stnListBuilds = 0;
function renderStnList() {
  const l = activeLine();
  const box = $("#stnList");
  $("#stnHeadName").textContent = l ? l.name : "未选线路";
  if (!l) {
    box.innerHTML = '<div class="empty"><b>未选择线路</b>在上方列表点一条线路，即可看到它的车站序列。</div>';
    stnListKey = null;
    return;
  }
  if (!l.stations.length) {
    box.innerHTML = '<div class="empty"><b>空线路</b>按 <kbd>A</kbd> 切到加站工具，<br>在地图上依次点击各站位置。<br><span style="color:var(--text-dim);font-size:11px">（需先选中当前线路，或先点地图）</span></div>';
    stnListKey = null;
    return;
  }
  const key = stnStructKey(l);
  if (key !== null && key === stnListKey && box.children.length === l.stations.length) {
    stnListPatches++;
    patchStnSel(box);
    return;
  }
  stnListBuilds++;
  const c = l.color;
  box.innerHTML = l.stations.map((id, i) => {
    const st = station(id); if (!st) return "";
    const xfer = st.lines.length > 1;
    const last = i === l.stations.length - 1;
    const sel2 = sel.station === id;
    return '<div class="stn' + (xfer ? " is-x" : "") + (sel2 ? " is-sel" : "") +
      '" data-id="' + id + '" data-idx="' + i + '" draggable="true"' +
      ' title="拖动可改站序（当前第 ' + (i + 1) + ' 站）" style="--lc:' + c + '">' +
      '<span class="stn-idx">' + (i + 1) + "</span>" +
      '<span class="stn-rail"><i></i></span>' +
      '<span class="stn-name" data-act="rename">' + esc(st.name) + (xfer ? ' <em style="font-style:normal;font-family:var(--font-mono);font-size:9px;color:var(--signal)">⇄' + st.lines.length + "</em>" : "") + "</span>" +
      '<span class="stn-acts">' +
      '<button data-act="up" title="上移"' + (i === 0 ? " disabled style=opacity:.25" : "") + '><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>' +
      '<button data-act="down" title="下移"' + (last ? " disabled style=opacity:.25" : "") + '><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>' +
      '<button data-act="ins" title="在此站后插入新站"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>' +
      '<button data-act="goto" title="在地图上定位"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>' +
      "</span></div>";
  }).join("");
  stnListKey = key;
}

function renderLegend() {
  const vis = P.lines.filter((l) => l.visible);
  const box = $("#legend");
  if (!vis.length) { box.style.display = "none"; return; }
  box.style.display = "flex";
  box.innerHTML = '<div class="legend-h">图例 Legend</div>' + vis.map((l) =>
    '<div class="legend-r"><s style="background:' + l.color + '"></s>' + esc(l.name) + (l.loop ? " · 环线" : "") + (l.style === "dash" ? " · 在建" : "") + "</div>").join("");
}

function syncLabelBtn() {
  const b = $("#zGrid");
  if (b) {
    b.classList.toggle("on", !!settings.showLabels);
    b.title = (settings.showLabels ? "隐藏" : "显示") + "站点标签";
  }
  const c = $("#sLabel");
  if (c && !settings.showLabels) { c.textContent = "标签 关"; c.style.color = "var(--signal)"; }
}
/* 时间戳只有"是有限正数"才可信：导入档的 updatedAt 可能是 undefined / null / 字符串，
   直接 new Date(...) 会得到 "Invalid Date" 显示在状态栏上（实测过）。 */
function validStamp(ts) { const n = Number(ts); return isNum(n) && n > 0; }
function timeText(ts) { return validStamp(ts) ? new Date(Number(ts)).toLocaleTimeString("zh-CN", { hour12: false }) : "—"; }
function renderStatus() {  $("#sTool").textContent = tool === "add" ? (pendingInsert ? "INSERT #" + (pendingInsert.index + 1) : "ADD STATION") : tool === "link" ? ("LINK ×" + linkChain.length) : "SELECT";
  $("#sStn").textContent = Object.keys(P.stations).length;
  $("#sLen").textContent = fmt(totalLength());
  $("#sProj").textContent = P.name;
  $("#sTime").textContent = timeText(P && P.updatedAt);
  const hints = {
    select: pendingInsert ? "点击地图插入位置 —— 第 " + (pendingInsert.index + 1) + " 站之后" : tool === "link" ? "连线：点击地图落站 / 点击已有站复用，攒够了一段再点「并入」或「新建线路」" : "点击选线 / 选站，拖动圆点改位置，右侧列表拖行改站序，滚轮缩放地图",
    add: pendingInsert ? "点击地图插入车站（第 " + (pendingInsert.index + 1) + " 站之后）" : "在地图上依次点击生成车站；靠近已有车站会自动转为换乘站",
    link: linkMode === "place" ? "布置车站：点空白处放站，拖动圆点改位置；准备好后点「拖线连接」" : "拖线连接：从车站圆点按住拖到另一站，松开吸附；连接确认后保存，Ctrl+Z 撤一步"
  };
  $("#sHint").textContent = hints[tool];
  $("#modeText").textContent = tool === "add" ? (pendingInsert ? "插入车站" : "加站模式") : tool === "link" ? (linkMode === "place" ? "布置车站" : "拖线连接") : "选择 / 编辑";
  $("#inspTag").textContent = sel.station ? "车站" : sel.line ? "线路" : "图纸";
}
/* ============================================================
   11. 检查器
   ============================================================ */
function renderInspector() {
  const box = $("#inspector");
  if (sel.station && station(sel.station)) box.innerHTML = inspStation(station(sel.station));
  else if (sel.line && line(sel.line)) box.innerHTML = inspLine(line(sel.line));
  else box.innerHTML = inspProject();
}

/* 空图纸 / 空线路是最容易被卡住的一屏：右侧只有一堆 0 和两个跟当前状态无关的按钮。
   这里按"缺线路还是缺车站"给出具体下一步，并把两个动作做成按钮，不用记快捷键。 */
function inspStart(noLine) {
  const steps = noLine
    ? [["L", "新建一条线路；也可以直接进下一步，点第一个站时会自动建一条"],
       ["A", "加站模式：在地图上依次点击，相邻两点连成线路，落点靠近已有车站会自动并成换乘站"],
       ["Esc", "退出加站模式；Ctrl+Z 撤销，改动每步自动写进浏览器本地存储"]]
    : [["点击线路", "先在左侧列表选中一条线路，加站只会加到当前选中的线路上"],
       ["A", "加站模式：在地图上依次点击即可延长这条线；拖住圆点能直接改位置"],
       ["双击线", "线画出来之后，双击线上任意处插入弯道点，把走廊拉弯"]];
  return '<div class="insp-sec"><h4>开始绘制<em></em></h4>' +
    steps.map((s) => '<div class="help-row"><kbd>' + esc(s[0]) + "</kbd><span>" + esc(s[1]) + "</span></div>").join("") +
    '<div class="row-btns">' + (noLine ? '<button class="tool" data-cmd="newLine"><svg viewBox="0 0 24 24"><path d="M5 19L12 5l7 14"/><circle cx="12" cy="12" r="9"/></svg>新建线路</button>' : "") +
    '<button class="tool" data-cmd="addMode"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="4"/></svg>加站模式</button></div></div>';
}

function inspProject() {
  const stns = Object.keys(P.stations).length;
  const noLine = !P.lines.length;
  const nothing = noLine && !stns;
  return (noLine || !stns ? inspStart(noLine) : "") +
    '<div class="insp-sec"><h4>图纸概览<em></em></h4>' +
    '<div class="stat-grid">' +
    '<div class="stat"><b>' + P.lines.length + "</b><span>线路 Lines</span></div>" +
    '<div class="stat"><b>' + stns + "</b><span>车站 Stations</span></div>" +
    '<div class="stat"><b>' + interchangeCount() + "</b><span>换乘 Transfers</span></div>" +
    '<div class="stat"><b>' + fmt(totalLength()) + '<small>km</small></b><span>运营里程 Route-km</span></div>' +
    "</div>" +
    '<div class="row-btns"><button class="tool" data-cmd="fitAll"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>适应全图</button>' +
    /* 图纸本来就是空的还让"清空"，只会换来一次没有意义的确认框 */
    (nothing ? "" : '<button class="tool" data-cmd="clearAll"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>清空图纸</button>') +
    (nothing ? "" : '<button class="tool" data-cmd="gcjToWgs" title="早年在高德/谷歌底图上照着路点的站，存下的数值其实是 GCJ-02；点一下反算成真正的 WGS-84，画面不动，之后开自动套合就贴路">坐标 GCJ-02 → WGS-84</button>') + "</div></div>" +

    '<div class="insp-sec"><h4>视图 View<em></em></h4>' +
    '<div class="field"><label>中心</label><input type="text" readonly value="' + P.center[0].toFixed(5) + ", " + P.center[1].toFixed(5) + '"></div>' +
    '<div class="field"><label>缩放</label><input type="text" readonly value="Z' + map.getZoom() + '"></div>' +
    '<div class="field"><label>坐标系</label><input type="text" readonly value="WGS-84 记录 / 高德底图为 GCJ-02"></div></div>' +

    '<div class="insp-sec"><h4>存储 Storage<em></em></h4>' +
    '<p style="margin:0 0 9px;font-size:12px;line-height:1.8;color:var(--text-mid)">每张图纸独立存在浏览器本地 <code style="font-family:var(--font-mono);color:var(--signal)">localStorage</code>，编辑后约 0.5 秒自动落盘；换机器请用 <b style="color:var(--text)">JSON</b> 导出带走。</p>' +
    '<div class="row-btns"><button class="tool" data-cmd="exportJson">导出 JSON</button><button class="tool" data-cmd="exportSvg">导出 SVG</button></div>' +
    '<div class="row-btns"><button class="tool" data-cmd="listStore">查看本地键</button></div></div>';
}

function inspLine(l) {
  const idx = P.lines.indexOf(l);
  return '<div class="insp-sec"><h4>线路属性<em></em><span style="color:' + l.color + '">●</span></h4>' +
    '<div class="field"><label>名称</label><input type="text" data-k="name" data-t="line" value="' + esc(l.name) + '" placeholder="如 1 号线 / 滨江线"></div>' +
    '<div class="field"><label>英文报站</label><input type="text" data-k="nameEn" data-t="line" value="' + esc(l.nameEn || "") + '" maxlength="120" aria-label="英文/拼音（报站）" title="英文/拼音（报站）；留空时数字线路自动使用 Line N，其他名称使用拼音" placeholder="英文 / 拼音；留空自动识别"></div>' +
    '<div class="field"><label>编号</label><input type="text" data-k="badge" data-t="line" value="' + esc(l.badge) + '" maxlength="4" placeholder="留空则跟随线路名"></div>' +
    '<div class="field"><label>颜色</label><input type="color" data-k="color" data-t="line" value="' + l.color + '"><input type="text" data-k="colorhex" data-t="line" value="' + l.color + '" style="font-family:var(--font-mono);font-size:11px"></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px">' +

    '<div class="field"><label>样式</label><div class="seg">' +

    '<button data-set="style:dash" class="' + (l.style === "dash" ? "is-on" : "") + '">虚线·在建</button>' +
    "</div></div>" +
    '<div class="field"><label>线型</label><div class="seg">' +
    '<button data-set="mode:mono" class="' + (l.colorMode === "dotted" ? "" : "is-on") + '">单色</button>' +

    (l.colorMode === "dotted"
      ? '<div class="field"><label>第二色</label><input type="color" data-k="color2" data-t="line" value="' + l.color2 + '"><input type="text" data-k="color2hex" data-t="line" value="' + l.color2 + '" style="font-family:var(--font-mono);font-size:11px"></div>'
      : "") +
    '<div class="field"><label>走向</label><div class="seg">' +
    '<button data-set="shape:open" class="' + (l.loop ? "" : "is-on") + '">普通线路</button>' +
    '<button data-set="shape:loop" class="' + (l.loop ? "is-on" : "") + '">闭合成环</button>' +
    "</div></div>" +
    '<label class="chk" style="--c:' + l.color + ';margin-top:9px"><input type="checkbox" data-k="stack" data-t="line"' + (l.stack === false ? "" : " checked") + ">共走廊时与其它线路并排</label>" +
    '<p style="margin:7px 0 0;font-size:11px;color:var(--text-dim);line-height:1.7">双色点线对应大小交路 / 快慢车；并排间距按本走廊最粗线路 +4.5px 自动分配，缩放时保持恒定屏幕距离。闭合环线要求至少 3 站，站序本身不变，只是末站接回首站。</p></div>' +

    '<div class="row-btns"><button class="tool" data-cmd="straighten"' + (bendCount(l) ? "" : " disabled") + ">全部改直</button>" +
    '<button class="tool" data-cmd="flipBends">反转所有弯</button></div></div>' +

    '<div class="insp-sec"><h4>统计<em></em></h4><div class="stat-grid">' +

    '<div class="stat"><b>' + fmt(lineLength(l)) + '<small>km</small></b><span>线路长度</span></div>' +
    "</div>" +
    '<div class="row-btns"><button class="tool" data-cmd="fitLine"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>适应线路</button>' +
    '<button class="tool" data-cmd="dupLine">复制</button>' +
    '<button class="tool" data-cmd="hideLine">' + (l.visible ? "隐藏" : "显示") + "</button></div></div>" +

    '<div class="insp-sec"><h4>危险区<em></em></h4>' +
    '<div class="row-btns"><button class="tool danger" data-cmd="delLine" style="flex:1;justify-content:center">删除线路（含 ' + l.stations.length + " 站引用）</button></div>" +

    '<div class="insp-sec"><h4>顺序<em></em></h4><div class="row-btns">' +

function inspStation(st) {
  const ls = stationLines(st, false);      // 面板里连隐藏的线也要列出来，onlyVisible=false
  return '<div class="insp-sec"><h4>车站<em></em>' + (st.lines.length > 1 ? '<span style="color:var(--signal)">换乘站</span>' : "") + "</h4>" +
    '<div class="field"><label>站名</label><input type="text" data-k="name" data-t="stn" value="' + esc(st.name) + '"></div>' +
    '<div class="field"><label>英文报站</label><input type="text" data-k="nameEn" data-t="stn" value="' + esc(st.nameEn || "") + '" maxlength="120" aria-label="英文/拼音（报站）" title="英文/拼音（报站）；留空时按站名拼音播报，可在此填写正式英文名称" placeholder="英文 / 拼音；留空使用站名拼音"></div>' +
    '<div class="field"><label>经度</label><input type="number" step="0.000001" data-k="lng" data-t="stn" value="' + st.lng.toFixed(6) + '"></div>' +

/* 检查器事件委托 */
function bindInspector() {
  const box = $("#inspector");
  const onField = (e) => {
    const t = e.target, k = t.dataset.k;
    if (!k || (t.type === "checkbox" && e.type === "input")) return;
    const val = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.t === "line") { const l = activeLine(); if (l) setLineField(l, k, val, t, e.type === "change"); }
    else if (t.dataset.t === "stn") { const st = sel.station && station(sel.station); if (st) setStnField(st, k, val, t, e.type === "change"); }
  };
  box.addEventListener("input", onField);
  box.addEventListener("change", onField);
  box.addEventListener("click", (e) => {
    const c = e.target.closest("[data-color]");
    if (c) { const l = activeLine(); if (l) { pushHistory(); l.color = c.dataset.color; renderAll(); markDirty(); } return; }
    const s = e.target.closest("[data-set]");
    if (s) {
      const [key, val] = s.dataset.set.split(":");
      if (key === "style") { const l = activeLine(); if (l) { pushHistory(); l.style = val; renderAll(); markDirty(); } }
      if (key === "mode") { const l = activeLine(); if (l) { pushHistory(); l.colorMode = val; renderAll(); markDirty(); } }
      if (key === "shape") {
        const l = activeLine(); if (!l) return;
        if (val === "loop" && l.stations.length < 3) { toast("闭合环线至少需要 3 个车站", "bad"); return; }
        pushHistory(); l.loop = val === "loop"; renderAll(); markDirty();
        toast(l.loop ? "已闭合成环" : "已断开为普通线路");
      }
      if (key === "feat") { const st = station(sel.station); if (!st) return; moveStnToEnd(st, val === "term"); }
      return;
    }
    const a = e.target.closest("[data-attach]");
    if (a) { toggleAttach(a.dataset.attach, a.checked); return; }
    const cmd = e.target.closest("[data-cmd]");
    if (cmd) runCmd(cmd.dataset.cmd, cmd);
  });
}

function setLineField(l, k, v, el, isChange) {
  /* 应用内输入一律先裁到位：用户永远造不出"导入会被拒"的那种数据。
     只把裁好的值写回这个输入框（不重画整个检查器，否则打字中途焦点会被抢走）；
     提示只在 change（失焦）时给一次，避免每敲一个字弹一条。 */
  if (k === "name" || k === "nameEn" || k === "badge") {
    const c = clipText(k, v);
    if (c.changed) {
      v = c.value;
      if (el) el.value = v;
      if (isChange) toast("名称" + c.why + "（上限 " + TEXT_LIMITS[k] + " 字）", "bad");
    }
  }
  pushHistory();
  if (k === "width") {
    l.width = clamp(parseInt(v, 10) || 6, 1, 20);
    const num = $('#inspector input[data-k="width"]');
    num && num.closest(".field") && (num.closest(".field").querySelector(".num").textContent = l.width + "px");
  }
  else if (k === "colorhex") { if (/^#[0-9a-fA-F]{6}$/.test(v)) l.color = v; else { hist.pop(); updateHistoryButtons(); return; } }
  else if (k === "color2hex") { if (/^#[0-9a-fA-F]{6}$/.test(v)) l.color2 = v; else { hist.pop(); updateHistoryButtons(); return; } }
  else if (k === "stack") l.stack = !!v;
  else if (k === "name") syncBadgeOnRename(l, v, P.lines.indexOf(l));
  else if (k === "nameEn") { if (String(v).trim()) l.nameEn = v; else delete l.nameEn; }
  else if (k === "badge") l.badge = String(v).trim() ? v : autoBadge(l.name, P.lines.indexOf(l));
  else l[k] = v;
  renderMap(); renderLineList(); renderLegend(); renderStatus(); renderLinkBar(); markDirty();
}
function setStnField(st, k, v, el, isChange) {
  if (k === "name" || k === "nameEn" || k === "note") {
    const c = clipText(k, v);
    if (c.changed) {
      v = c.value;
      if (el) el.value = v;
      if (isChange) toast((k === "name" ? "站名" : k === "nameEn" ? "英文报站名" : "备注") + c.why + "（上限 " + TEXT_LIMITS[k] + " 字）", "bad");
    }
  }
  pushHistory();
  if (k === "lat") st.lat = clamp(parseFloat(v) || st.lat, -89.9999, 89.9999);
  else if (k === "lng") st.lng = clamp(parseFloat(v) || st.lng, -179.9999, 179.9999);
  else if (k === "name") st.name = v;
  else if (k === "nameEn") { if (String(v).trim()) st.nameEn = v; else delete st.nameEn; }
  else st[k] = v;
  renderMap(); renderStnList(); renderStatus(); renderLinkBar(); markDirty();
}
function toggleAttach(lid, on) {
  const st = station(sel.station), l = line(lid);
  if (!st || !l) return;
  pushHistory();
  if (on) { l.stations.push(st.id); if (!st.lines.includes(lid)) st.lines.push(lid); }
  else { l.stations = l.stations.filter((x) => x !== st.id); st.lines = st.lines.filter((x) => x !== lid); }
  pruneOrphans();
  renderAll(); markDirty();
}
function moveStnToEnd(st, asTerminal) {
  // 端点站：把它移到所属每条线路的末尾（示意性操作）；中间站：无位置变化
  if (!asTerminal) { toast("中间站：位置由站序决定，可在列表中上下移动"); return; }
  pushHistory();
  st.lines.forEach((lid) => {
    const l = line(lid); if (!l) return;
    l.stations = l.stations.filter((x) => x !== st.id).concat(st.id);
  });
  renderAll(); markDirty(); toast("已把该站排到所属线路末端");
}

/* ============================================================
   12. 选择 / 命令
   ============================================================ */
function selectLine(id, keep) {
  sel.line = id;
  if (!keep) sel.station = null;
  renderAll();
  const row = $('#lineList [data-id="' + id + '"]');
  row && row.scrollIntoView({ block: "nearest" });
}
function selectStation(id) { sel.station = id; const st = station(id); if (st && st.lines.length) sel.line = st.lines[0]; renderAll(); }
function deselect() { sel.station = null; renderAll(); }

function fitAll() {
  const pts = Object.values(P.stations);
  if (!pts.length) { toast("图纸是空的"); return; }
  const b = L.latLngBounds(pts.map((s) => [s.lat, s.lng]));
  viewByUser(); map.fitBounds(b.pad(0.18));
}
function fitLine(id) {
  const l = line(id || sel.line);
  if (!l || l.stations.length < 1) { toast("该线路还没有车站"); return; }
  const b = L.latLngBounds(linePoints(l));
  if (b.isValid()) { viewByUser(); map.fitBounds(b.pad(l.stations.length < 3 ? .5 : .2)); }
}
function pruneOrphans() {
  const revIds = visibleLineIndexAll();
  Object.keys(P.stations).forEach((id) => {
    const st = P.stations[id];
    st.lines = revIds.get(id) || [];
    if (!st.lines.length && !st.placed) delete P.stations[id];
  });
}
/* 含隐藏线版本的倒排，normalize / pruneOrphans 都用它，口径与
   `P.lines.filter(l => l.stations.includes(id))` 一致。 */
function visibleLineIndexAll() {
  const rev = new Map();
  for (let li = 0; li < P.lines.length; li++) {
    const l = P.lines[li], ids = l.stations, seen = new Set();
    for (let i = 0; i < ids.length; i++) {
      const id = ids[i];
      if (seen.has(id)) continue;
      seen.add(id);
      let a = rev.get(id);
      if (!a) { a = []; rev.set(id, a); }
      a.push(l.id);
    }
  }
  return rev;
}
function addLine(autoSelect) {
  pushHistory();
  const l = {
    id: uid("l_"), name: (P.lines.length + 1) + " 号线", badge: autoBadge((P.lines.length + 1) + " 号线", P.lines.length),
    color: nextColor(), width: 6, style: "solid", visible: true, stations: []
  };
  P.lines.push(l);
  if (autoSelect !== false) { sel.line = l.id; sel.station = null; }
  renderAll(); markDirty();
  const row = $('#lineList [data-id="' + l.id + '"]'); row && row.scrollIntoView({ block: "nearest" });
  return l;
}
function deleteLine(id) {
  const l = line(id); if (!l) return;
  pushHistory();
  P.lines = P.lines.filter((x) => x.id !== id);
  pruneOrphans();
  if (sel.line === id) { sel.line = P.lines[0] ? P.lines[0].id : null; sel.station = null; }
  renderAll(); markDirty(); toast("线路已删除", "good");
}
function duplicateLine(id) {
  const l = line(id); if (!l) return;
  pushHistory();
  const cp = JSON.parse(JSON.stringify(l));
  cp.id = uid("l_"); cp.name = l.name + " 副本"; cp.badge = l.badge + "b"; cp.color = nextColor();
  cp.stations.forEach((sid) => { const s = station(sid); s && s.lines.push(cp.id); });
  P.lines.splice(P.lines.indexOf(l) + 1, 0, cp);
  sel.line = cp.id; renderAll(); markDirty();
}
function reorderLine(idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= P.lines.length) return;
  pushHistory();
  const a = P.lines; [a[idx], a[to]] = [a[to], a[idx]];
  renderAll(); markDirty();
}
function deleteStation(id) {
  const st = station(id); if (!st) return;
  pushHistory();
  P.lines.forEach((l) => { l.stations = l.stations.filter((x) => x !== id); });
  delete P.stations[id];
  if (sel.station === id) sel.station = null;
  pruneOrphans(); renderAll(); markDirty(); toast("车站已删除", "good");
}
/* 拖拽改站序。三个坑：
   1) 行必须带自己的下标：一条线可以重复访问同一个站（visibleLineIndexAll 里那个
      seen Set 就是为准），拿 stations.indexOf(id) 会动到第一次出现的那一个；
   2) to 是「插到第 to 个之前」：先把被拖的那颗摘掉，它后面的下标整体左移一格；
   3) pendingInsert 按 index 记锚点，顺序一变它就指错地方，必须作废。
   弯道一律保留（被拆开的转休眠），绝不静默删用户手调的形状。 */
function reorderStation(lid, from, to) {
  const l = line(lid); if (!l) return false;
  const n = l.stations.length;
  if (!(n > 1) || from < 0 || from >= n) return false;
  if (to < 0 || to > n || from === to || from === to - 1) return false;
  const moved = l.stations[from];
  pushHistory();
  const a = l.stations, wasCurved = bendCount(l);
  a.splice(from, 1);
  a.splice(from < to ? to - 1 : to, 0, moved);
  pendingInsert = null;
  renderAll(); markDirty();
  const dorm = dormantBendCount(l);
  toast("「" + station(moved).name + "」已挪到第 " + (a.indexOf(moved) + 1) + " 位" +
    (dorm ? " · " + dorm + " 处弯道暂时休眠（挪回去就还在）；曲线 " + wasCurved + "→" + bendCount(l) + " 处" : ""), "good");
  return true;
}

function moveStation(lid, idx, dir) {
  const l = line(lid); if (!l) return;
  const to = idx + dir;
  if (to < 0 || to >= l.stations.length) return;
  pushHistory();
  const a = l.stations; [a[idx], a[to]] = [a[to], a[idx]];
  renderAll(); markDirty();
}

/* 把整张图的坐标从 GCJ-02 反算成 WGS-84（老档专用，一次性的）。
   为什么需要：这份图当年是"没有套合"的时候照着高德的路点的，存下的数值本身就是 GCJ 位置；
   一旦开了自动套合，它反而会离路网 2δ。转成真正的 WGS-84 之后，套合才既对老图对新图。
   只动 lat/lng：手动铭牌偏移是相对站点的像素、弯道是相对弦的比例，都不需要跟着改。
   可撤销（pushHistory 在最前面），转前转后画面不动 —— 断言就按这条判。 */
function convertProjectGcjToWgs() {
  const ids = Object.keys(P.stations);
  if (!ids.length) { toast("这张图还没有车站，不用转"); return false; }
  let moved = 0, maxM = 0;
  const next = {};
  ids.forEach((id) => {
    const st = P.stations[id], w = gcj2wgs(st.lat, st.lng);
    const m = metersBetween([st.lat, st.lng], [w[0], w[1]]);
    if (m > maxM) maxM = m;
    if (Math.abs(w[0] - st.lat) > 1e-12 || Math.abs(w[1] - st.lng) > 1e-12) moved++;
    next[id] = w;
  });
  if (!moved) { toast("这份图的坐标已经是 WGS-84（境内没找到需要反算的点）"); return false; }
  pushHistory();
  ids.forEach((id) => { const st = P.stations[id]; st.lat = next[id][0]; st.lng = next[id][1]; });
  /* 视图中心与站点同一口径：只搬站点不搬 center，整幅画面会凭空跳一格（z14 下约 58 px）。
     一起搬之后，"转换 + 开套合"与"转换前关套合"的屏幕位置逐站相同 —— 断言就按这条判。 */
  const c = gcj2wgs(P.center[0], P.center[1]);
  P.center = [c[0], c[1]];
  map.setView(P.center, map.getZoom(), { animate: false });
  renderAll(); markDirty();
  toast("已把 " + moved + "/" + ids.length + " 个车站从 GCJ-02 反算为 WGS-84（平均量级 " +
    Math.round(maxM) + " m 内），画面不动；Ctrl+Z 可撤销。现在开着「自动套合」就是准的。", "good", 8000);
  return true;
}

function runCmd(cmd, el) {
  const l = activeLine(); const st = sel.station && station(sel.station);
  switch (cmd) {
    case "fitAll": fitAll(); break;
    case "fitLine": fitLine(); break;
    /* 空图纸上的两个引导按钮：建线之后直接进加站，用户不必再记快捷键 */
    case "newLine": { const nl = addLine(); setTool("add"); toast("已新建「" + nl.name + "」，现在点地图就能落下第一个车站"); break; }
    case "archive": openArchive(); break;
    case "gcjToWgs": convertProjectGcjToWgs(); break;
    case "addMode":
      setTool("add");
      toast(activeLine() ? "加站模式：点击地图把站加到「" + activeLine().name + "」" : "加站模式：点击地图添加车站，没有选中线路时会自动新建一条线路");
      break;
    case "gotoStn": if (st) { viewByUser(); map.panTo([st.lat, st.lng], { animate: true }); } break;
    case "resetLabel":
      if (st && st.labelOff) { pushHistory(); st.labelOff = null; renderAll(); markDirty(); toast("已交还自动避让"); }
      break;
    case "dupLine": l && duplicateLine(l.id); break;
    case "hideLine": if (l) { pushHistory(); l.visible = !l.visible; renderAll(); markDirty(); } break;
    case "delLine": l && confirmDialog("删除线路", "确定删除「" + l.name + "」？该线上的 " + l.stations.length + " 个站若不属于其它线路也会被清掉。", () => deleteLine(l.id)); break;
    case "delStn": st && confirmDialog("删除车站", "确定删除「" + st.name + "」？它会从所有线路上摘除。", () => deleteStation(st.id)); break;
    case "lineUp": l && reorderLine(P.lines.indexOf(l), -1); break;
    case "lineDown": l && reorderLine(P.lines.indexOf(l), 1); break;
    case "straighten":
      if (l && bendCount(l)) { pushHistory(); l.bends = {}; renderAll(); markDirty(); toast("所有曲线已改直"); }
      break;
    case "flipBends":
      if (l && bendCount(l)) {
        pushHistory();
        Object.keys(l.bends).forEach((k) => {
          l.bends[k] = (l.bends[k] || []).map((b) => ({ along: 1 - b.along, normal: -b.normal })).sort((a, c) => a.along - c.along);
        });
        renderAll(); markDirty(); toast("弯曲方向已反转");
      }
      break;
    case "toggleLoop":
      if (l) {
        if (!l.loop && l.stations.length < 3) { toast("闭合环线至少需要 3 个车站", "bad"); break; }
        pushHistory(); l.loop = !l.loop; renderAll(); markDirty(); toast(l.loop ? "已闭合成环" : "已断开为普通线路");
      }
      break;
    case "exportJson": exportJson(); break;
    case "exportSvg": exportSvg(); break;
    case "clearAll": confirmDialog("清空图纸", "清空当前图纸的全部线路与车站（可用 Ctrl+Z 撤销）。", () => { pushHistory(); P.lines = []; P.stations = {}; sel = { line: null, station: null }; renderAll(); markDirty(); }); break;
    case "listStore": showStorage(); break;
    default: break;
  }
}
/* ============================================================
   13. 绘制交互
   ============================================================ */
function findNearStation(latlng, px, includeFree) {
  if (settings.mergeNear === false) return null;
  const limit = px || settings.mergePx || 24;
  const p = map.latLngToContainerPoint(latlng);
  let best = null, bd = limit;
  Object.values(P.stations).forEach((s) => {
    /* 加站模式只往"画出来的站"上合并（游离站不是它的目标）；连线模式反过来必须能
       认领游离站 —— 先定位置再连线时，那些站本来就还没归到任何线路上。
       （端到端实测：不加这个开关，点已定的游离站会又造出一个新站。） */
    if (!includeFree && !s.lines.length) return;
    const q = map.latLngToContainerPoint([s.lat, s.lng]);
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    if (d < bd) { bd = d; best = s; }
  });
  return best;
}
function onMapClick(e) {
  if (tool === "link") { linkAddPoint(e.latlng); return; }
  if (tool !== "add") { if (sel.station) deselect(); return; }
  addStationAt(e.latlng);
}
/* ============================================================
   13.2 连线：先布置站点，再从车站圆点拖线连接
   ============================================================ */
/* Plan one continuous connection without mutating the line or filtering away the
   user's existing stations. Existing portions must follow the line's actual
   order; multiple possible insertion results are deliberately rejected. */
function planLinkAppend(l, chainIds) {
  const fail = (reason) => ({ ok: false, reason, at: null, ids: [], loop: !!(l && l.loop) });

function bindPanels() {
  const ll = $("#lineList");
  ll.addEventListener("click", (e) => {
    const row = e.target.closest(".line-row"); if (!row) return;
    if (e.target.closest('[data-act="eye"]')) {
      const l = line(row.dataset.id); pushHistory(); l.visible = !l.visible; renderAll(); markDirty(); return;
    }
    selectLine(row.dataset.id);
  });
  ll.addEventListener("dblclick", (e) => { const r = e.target.closest(".line-row"); if (r) selectLine(r.dataset.id); });

  // 线路拖拽排序
  let dragIdx = null;
  ll.addEventListener("dragstart", (e) => { const r = e.target.closest(".line-row"); if (!r) return; dragIdx = +r.dataset.idx; r.classList.add("dragging"); });
  ll.addEventListener("dragover", (e) => { const r = e.target.closest(".line-row"); if (!r || dragIdx === null) return; e.preventDefault(); r.classList.add("is-drag-over"); });
  ll.addEventListener("dragleave", (e) => { const r = e.target.closest(".line-row"); r && r.classList.remove("is-drag-over"); });
  ll.addEventListener("drop", (e) => {
    const r = e.target.closest(".line-row"); if (!r || dragIdx === null) return;
    e.preventDefault();
    const to = +r.dataset.idx;
    if (to !== dragIdx) {
      pushHistory();
      const a = P.lines.splice(dragIdx, 1)[0]; P.lines.splice(to, 0, a);
      renderAll(); markDirty();
    }
    dragIdx = null; $$(".line-row").forEach((x) => x.classList.remove("is-drag-over", "dragging"));
  });

  const sl = $("#stnList");
  /* 拖拽改站序：行上半区=插到它之前，下半区=插到它之后，落点线画在哪就插到哪。 */
  let stnDrag = null;
  const clearStnDrop = () => { $$(".stn").forEach((x) => x.classList.remove("drop-before", "drop-after", "dragging")); };
  const stnDropIdx = (row, y) => {
    const r = row.getBoundingClientRect(), t = +row.dataset.idx;
    return (y - r.top) < r.height / 2 ? t : t + 1;
  };
  sl.addEventListener("dragstart", (e) => {
    const row = e.target.closest(".stn");
    if (!row || e.target.tagName === "INPUT") { stnDrag = null; e.preventDefault(); return; }
    stnDrag = +row.dataset.idx; row.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (err) {}
    }
  });
  sl.addEventListener("dragover", (e) => {
    const row = e.target.closest(".stn"); if (!row || stnDrag === null) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    const at = stnDropIdx(row, e.clientY);
    $$(".stn").forEach((x) => x.classList.remove("drop-before", "drop-after"));
    row.classList.add(at === +row.dataset.idx ? "drop-before" : "drop-after");
  });
  sl.addEventListener("drop", (e) => {
    const row = e.target.closest(".stn"); if (!row || stnDrag === null) return;
    e.preventDefault();
    reorderStation(sel.line, stnDrag, stnDropIdx(row, e.clientY));
    stnDrag = null; clearStnDrop();
  });
  sl.addEventListener("dragleave", (e) => {
    const row = e.target.closest(".stn"); if (row) row.classList.remove("drop-before", "drop-after");
  });
  sl.addEventListener("dragend", () => { stnDrag = null; clearStnDrop(); });
  sl.addEventListener("click", (e) => {
    const row = e.target.closest(".stn"); if (!row) return;
    const st = station(row.dataset.id); if (!st) return;
    const b = e.target.closest("[data-act]");
    const act = b && b.dataset.act;
    const idx = activeLine() ? activeLine().stations.indexOf(st.id) : -1;
    if (act === "up") return moveStation(sel.line, idx, -1);
    if (act === "down") return moveStation(sel.line, idx, 1);
    if (act === "ins") return setInsert(sel.line, idx);
    if (act === "goto") { viewByUser(); return map.panTo([st.lat, st.lng], { animate: true }); }
    selectStation(st.id);
  });
  sl.addEventListener("dblclick", (e) => {
    const row = e.target.closest(".stn"); if (!row) return;
    const nameEl = row.querySelector(".stn-name");
    renameInline(nameEl, station(row.dataset.id));
  });
}
