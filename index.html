  /* 只有"存储确实读得到"时，读不到档案才算幽灵。读不动（无痕模式、站点数据被拦、配额异常）
     的时候一律不清：否则一次读失败就会把用户整张图纸列表从注册表里抹掉，而紧接着的 boot
     还会因为"列表空了"新建一张示例档盖掉注册表 —— 档案本身还在盘上，但用户在界面上再也
     看不到它们。这条由第 66 条断言把 localStorage 打成 SecurityError 实测守住。 */
  if (lsGet(K_REG) === null) return 0;
  const ghosts = (reg.projects || []).filter((x) => x && x.id && !lsGet(K_PROJ(x.id)) && !lsGet(K_PREV(x.id)));
  if (!ghosts.length) return 0;
  reg.projects = reg.projects.filter((x) => ghosts.indexOf(x) < 0);
  if (ghosts.some((g) => g.id === reg.active)) reg.active = reg.projects.length ? reg.projects[0].id : null;
  store.set(K_REG, reg);
  console.warn("[boot] 摘除无数据的图纸记录", ghosts.map((g) => g.id).join(","));
  return ghosts.length;
}
/* 注册表读成空、但盘上还留着 project.<id> 档案时，先把档案捞回来重建列表，
   而不是直接新建一张示例图纸把注册表盖掉 —— 后者会让用户"画过的图从界面上消失"，
   而数据其实一直都在磁盘上（这类事故的成因有几种：旧版本遗留、手工删过键、
   某条自检漏还原了注册表、上一轮修的"存储读不到被当成幽灵"）。
   返回 false 表示确实无档可捞，调用方再走新建示例那条路。 */
function rebuildRegFromArchives() {
  const pre = NS + ".project.";
  const ids = [];
  for (let i = 0, n = lsLen(); i < n; i++) { const k = lsKey(i); if (k && k.indexOf(pre) === 0) ids.push(k.slice(pre.length)); }
  const projects = [];
  ids.forEach((id) => {
    const p = store.get(K_PROJ(id), null);
    if (p && typeof p === "object" && p.name) projects.push({ id: id, name: String(p.name), updatedAt: p.updatedAt || 0,
      lines: (p.lines || []).length, stations: Object.keys(p.stations || {}).length });
  });
  if (!projects.length) return false;
  projects.sort((a, b) => b.updatedAt - a.updatedAt);
  reg = { projects: projects, active: projects[0].id };
  store.set(K_REG, reg);
  console.warn("[boot] 注册表为空但盘上有 " + projects.length + " 份图纸档案，已按档案重建列表");
  return true;
}
function boot() {
  initMap();
  bindChrome(); bindPanels(); bindInspector(); bindKeys();
  const orphans = gcStorage();
  const ghostN = pruneGhostRegistry();

  const bootHadData = !!(reg.projects && reg.projects.length);
  if (!reg.projects || !reg.projects.length) {
    if (!rebuildRegFromArchives()) {
    const p = demoProject();
    store.set(K_PROJ(p.id), p);
    reg = { projects: [{ id: p.id, name: p.name, updatedAt: p.updatedAt, lines: p.lines.length, stations: Object.keys(p.stations).length }], active: p.id };
    store.set(K_REG, reg);
    }
  }
  const target = reg.projects.some((p) => p.id === reg.active) ? reg.active : reg.projects[0].id;
  openProject(target);
  setTimeout(() => { toast((orphans ? "已清理 " + orphans + " 份无主的旧备份" : "已就绪") + (ghostN ? "；摘除 " + ghostN + " 条没有数据的图纸记录" : "") + "。数据自动存在本机，按 ? 看快捷键"); }, 260);
  if (/[?&]selftest/.test(location.search)) setTimeout(showSelfTest, 500);
  /* 服务器种子图纸：换一台设备打开同一个地址就能看到你导出的图，不必重新导文件。
     带 ?selftest 时完全不碰（种子是异步落进注册表的，会把自检的存储核对搅浑）。
     这台设备本来没有自己的图纸时，直接把第一张种子图打开给他看。 */
  if (!/[?&]selftest/.test(location.search)) {
    loadServerSeeds().then((n) => {
      if (!n || inSelfTest) return;
      if (!bootHadData && lastSeedId && reg.projects.some((p) => p.id === lastSeedId)) openProject(lastSeedId);
      toast("服务器图纸已并入 " + n + " 张（左上角图纸列表可切换）", "good");
    }).catch(() => { });
  }
}
let booted = false;
function start() { if (booted) return; booted = true; boot(); }
/* Leaflet 的 CSS 没加载时不会抛错，只会画出一张层序全乱、缩放一塌糊涂的地图 ——
   比直接报错更难查。用一个计算样式探针确认它真的生效（.leaflet-pane 必须是
   absolute；没 CSS 的话是 static）。 */
function leafletCssActive() {
  if (!document.body) return false;
  const host = document.createElement("div");
  host.style.cssText = "position:absolute;left:-99999px;top:0;width:10px;height:10px";
  const pane = document.createElement("div");
  pane.className = "leaflet-pane";
  host.appendChild(pane);
  document.body.appendChild(host);
  let pos = "static";
  try { pos = getComputedStyle(pane).position; } catch (e) { pos = "static"; }
  document.body.removeChild(host);
  return pos === "absolute";
}
/* 只负责拼字符串，不改 document.body —— 这样自检能核对文案，而不用真的把 Leaflet 拆掉。 */
function fatalCardHtml(title, lines) {
  return '<div style="padding:56px 40px;font:14px/2 sans-serif;color:#E7EDF5;background:#0B0E13;min-height:100vh">' +
    "<b style=\"font-size:18px\">" + esc(title) + "</b>" +
    lines.map((l) => "<p style=\"color:#9FB0C3;margin:10px 0 0\">" + l + "</p>").join("") + "</div>";
}
/* 判定抽成纯函数，自检才能不用真的把 Leaflet 拆掉就覆盖三种失败分支。 */
function runtimeVerdict(hasL, cssActive) { return !hasL ? "no-js" : !cssActive ? "no-css" : "ok"; }
const FATAL_JS = ["这个页面是单文件应用，依赖同目录的 <code>vendor/leaflet.js</code>（离线兜底）或网络上的 CDN。",
  "请确认 <b>index.html 与 vendor/ 文件夹放在一起</b>，然后刷新；联网时也可以直接刷新由 CDN 补载。"];
const FATAL_CSS = ["脚本已经加载，但 <code>vendor/leaflet.css</code> 没有生效；离线且 CDN 也不通时无法绘制。",
  "请把 <b>vendor/leaflet.css</b> 与本文件放在同一目录（连同 leaflet.js），或联网后刷新。"];
function startWithChecks() {
  if (runtimeVerdict(!!window.L, leafletCssActive()) === "no-js") {
    document.body.innerHTML = fatalCardHtml("Leaflet 未能加载，地图无法启动。", FATAL_JS);
    return;
  }
  if (leafletCssActive()) { start(); return; }
  /* 本地 CSS 没生效：补一条 CDN 的，等它 load/error（或 1.5 秒超时）再判一次 */
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  const retry = () => {
    if (booted) return;
    if (runtimeVerdict(true, leafletCssActive()) === "ok") start();
    else document.body.innerHTML = fatalCardHtml("Leaflet 的样式没能加载，地图会画成一片乱码。", FATAL_CSS);
  };
  link.addEventListener("load", retry);
  link.addEventListener("error", retry);
  document.head.appendChild(link);
  setTimeout(retry, 1500);
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", startWithChecks);
} else {
  startWithChecks();
}
</script>
